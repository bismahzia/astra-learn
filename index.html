// JS FUNCTIONS
let currentSubject="", currentChapter="", currentQ=0, score=0;

function showHome(){
 ['home','chapterMenu','quizBox','gameBox','aiBot'].forEach(id=>document.getElementById(id).classList.add('hidden'));
 document.getElementById('home').classList.remove('hidden');
}

function showSubjects(sub){
 currentSubject = sub;
 let menu = document.getElementById('chapterMenu');
 menu.innerHTML = `<h2 class="text-2xl font-bold mb-4">${QUIZ_DATA[sub].name} - Select Chapter</h2>`;
 for(let ch in QUIZ_DATA[sub]){
  if(ch.startsWith("CH")){
   menu.innerHTML += `<button onclick="startQuiz('${sub}','${ch}')" class="btn btn-primary m-2">${QUIZ_DATA[sub][ch].name}</button>`;
  }
 showDiv('chapterMenu');
}

function startQuiz(sub, ch){
 currentSubject=sub; currentChapter=ch; currentQ=0; score=0;
 showDiv('quizBox'); loadQuestion();
}

function loadQuestion(){
 let qData = QUIZ_DATA[currentSubject][currentChapter].topics.MCQs[currentQ];
 document.getElementById('quizBox').innerHTML = `
  <div class="glass p-6 rounded-2xl">
   <h3 class="text-xl mb-2">${QUIZ_DATA[currentSubject][currentChapter].name}</h3>
   <p class="text-sm text-cyan-300 mb-4">Formula: ${QUIZ_DATA[currentSubject][currentChapter].formula}</p>
   <h4 class="text-lg mb-4">${qData.q}</h4>
   ${qData.opts.map((opt,i)=>`<button onclick="checkAns(${i})" class="btn-option">${i+1}. ${opt}</button>`).join('')}
   <p class="mt-4">Question ${currentQ+1} / 20</p>
  </div>
 `;
}

function checkAns(i){
 let qData = QUIZ_DATA[currentSubject][currentChapter].topics.MCQs[currentQ];
 if(i==qData.ans) score++;
 currentQ++;
 if(currentQ < 20) loadQuestion();
 else alert(`Quiz Complete! Score: ${score}/20`);
}

function showGame(){ showDiv('gameBox'); document.getElementById('gameBox').innerHTML="<h2>Game Coming Soon</h2>"; }
function showAiBot(){ showDiv('aiBot'); document.getElementById('aiBot').innerHTML="<h2>AI Bot Coming Soon</h2>"; }
function showDiv(id){
 ['home','chapterMenu','quizBox','gameBox','aiBot'].forEach(d=>document.getElementById(d).classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
}
</script>
