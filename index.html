<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstraLearn | FBISE FULL BOOK</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
body{background:#0B1120;color:#E5E7EB;font-family:'Poppins';padding:20px;margin:0;}
.header{text-align:center;padding:30px;background:linear-gradient(135deg,#131C31,#0B1120);border-radius:20px;margin-bottom:20px;}
.header h1{background:linear-gradient(90deg,#00D9FF,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:2.8em;margin:0;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;}
.card{background:#131C31;padding:25px;border-radius:15px;border:1px solid #7C3AED;transition:0.3s;}
.card:hover{border-color:#00D9FF;transform:translateY(-5px);}
.card h3{color:#00D9FF;margin-top:0;}
.topic{background:#0B1120;padding:15px;margin:10px 0;border-radius:10px;border-left:3px solid #00D9FF;}
.btn{background:#7C3AED;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;margin-top:10px;cursor:pointer;font-weight:600;}
.btn:hover{background:#6D28D9;}
.btn-small{background:#00D9FF;font-size:0.9em;padding:10px;width:48%;display:inline-block;margin-right:2%;}
.btn-ai{background:linear-gradient(90deg,#00D9FF,#06B6D4);}
.btn-secondary{background:#374151;}
#quizBox,#gameBox{background:#131C31;padding:25px;margin:20px auto;max-width:850px;border-radius:15px;display:none;border:1px solid #00D9FF;}
.ai-box{background:#0B1120;padding:15px;margin-top:15px;border-radius:12px;display:none;border:1px dashed #00D9FF;}
.ai-input{width:100%;padding:10px;background:#131C31;color:#fff;border:1px solid #374151;border-radius:8px;margin-bottom:10px;box-sizing:border-box;}
code{background:#0B1120;padding:10px 15px;border-radius:8px;color:#00D9FF;display:block;white-space:pre-wrap;margin:10px 0;}
</style>
</head>
<body>

<div id="home" class="grid"></div>
<div id="quizBox"></div>
<div id="gameBox"></div>

<script>

D['phy11-ch7']={name:"Physics 11 - Ch 7: Oscillations",topics:[{t:"7.1 SHM",s:"SLO: T=2π√l/g",test:make20("T pendulum","2π√l/g","2π√g/l","√l/g","None","2π√l/g")}],test:make30("Ch7 Full","A","B","C","D","A")};
D['phy11-ch8']={name:"Physics 11 - Ch 8: Waves",topics:[{t:"8.1 Wave Eq",s:"SLO: v=fλ",test:make20("v=","fλ","λ/f","f/λ","None","fλ")}],test:make30("Ch8 Full","A","B","C","D","A")};
D['phy11-ch9']={name:"Physics 11 - Ch 9: Optics",topics:[{t:"9.1 Interference",s:"SLO: Bright",test:make20("Bright fringe","nλ","(n+0.5)λ","λ/2","None","nλ")}],test:make30("Ch9 Full","A","B","C","D","A")};
D['phy11-ch10']={name:"Physics 11 - Ch 10: Thermodynamics",topics:[{t:"10.1 1st Law",s:"SLO: ΔQ=ΔU+ΔW",test:make20("1st Law","ΔQ=ΔU+ΔW","PV=nRT","W=Fd","F=ma","ΔQ=ΔU+ΔW")}],test:make30("Ch10 Full","A","B","C","D","A")};

// ========== PHYSICS 12 - 6 CHAPTERS ==========
D['phy12-ch1']={name:"Physics 12 - Ch 1: Electrostatics",topics:[{t:"1.1 Coulomb",s:"SLO: F=kq1q2/r²",test:make20("k=","9x10^9","8.85x10^-12","4πx10^-7","1","9x10^9")},{t:"1.2 E-Field",s:"SLO: E=F/q",test:make20("Unit E","N/C","V","J","W","N/C")}],test:make30("Ch1 Full","A","B","C","D","A")};
D['phy12-ch2']={name:"Physics 12 - Ch 2: Current Electricity",topics:[{t:"2.1 Ohm",s:"SLO: V=IR",test:make20("R=","V/I","I/V","VI","V+I","V/I")}],test:make30("Ch2 Full","A","B","C","D","A")};

D['phy12-ch4']={name:"Physics 12 - Ch 4: AC",topics:[{t:"4.1 Impedance",s:"SLO: Z",test:make20("Z=","√R²+XL²","R+XL","R-XL","R*XL","√R²+XL²")}],test:make30("Ch4 Full","A","B","C","D","A")};

// ========== MATHS 11 - 9 CHAPTERS ==========

D['math11-ch2']={name:"Math 11 - Ch 2: Quadratic",topics:[{t:"2.1 Formula",s:"SLO: Roots",test:make20("Roots x²-5x+6","2,3","1,6","-2,-3","0,5","2,3")}],test:make30("Ch2 Full","A","B","C","D","A")};
D['math11-ch3']={name:"Math 11 - Ch 3: Matrices",topics:[{t:"3.1 Order",s:"SLO: 2x3",test:make20("Order 2x3","2x3","3x2","6","2","2x3")}],test:make30("Ch3 Full","A","B","C","D","A")};
D['math11-ch4']={name:"Math 11 - Ch 4: Partial Fractions",topics:[{t:"4.1 Decompose",s:"SLO: A/x+B",test:make20("1/x(x+1)","A/x+B/(x+1)","A+B","1/x+1","None","A/x+B/(x+1)")}],test:make30("Ch4 Full","A","B","C","D","A")};
D['math11-ch5']={name:"Math 11 - Ch 5: Sequences",topics:[{t:"5.1 AP",s:"SLO: an=a+(n-1)d",test:make20("5th term 2,4,6","10","8","12","14","10")}],test:make30("Ch5 Full","A","B","C","D","A")};
D['math11-ch6']={name:"Math 11 - Ch 6: Permutation",topics:[{t:"6.1 nPr",s:"SLO: n!/(n-r)!",test:make20("5P2","20","10","5","25","20")}],test:make30("Ch6 Full","A","B","C","D","A")};
D['math11-ch7']={name:"Math 11 - Ch 7: Induction",topics:[{t:"7.1 Base Case",s:"SLO: Step1",test:make20("1st step","Base case","Assume","Prove","None","Base case")}],test:make30("Ch7 Full","A","B","C","D","A")};
D['math11-ch8']={name:"Math 11 - Ch 8: Trigonometry",topics:[{t:"8.1 Identity",s:"SLO: sin²+cos²",test:make20("sin²+cos²","1","0","2","-1","1")}],test:make30("Ch8 Full","A","B","C","D","A")};
D['math11-ch9']={name:"Math 11 - Ch 9: Limits",topics:[{t:"9.1 Limit",s:"SLO: lim",test:make20("lim x->2 x²","4","2","0","1","4")}],test:make30("Ch9 Full","A","B","C","D","A")};

// ========== MATHS 12 - 6 CHAPTERS ==========
D['math12-ch1']={name:"Math 12 - Ch 1: Inverse Trig",topics:[{t:"1.1 Range",s:"SLO: sin-1",test:make20("Range sin-1","[-π/2,π/2]","[0,π]","R","[-1,1]","[-π/2,π/2]")}],test:make30("Ch1 Full","A","B","C","D","A")};
D['math12-ch2']={name:"Math 12 - Ch 2: Differentiation",topics:[{t:"2.1 Derivative",s:"SLO: d/dx",test:make20("d/dx x³","3x²","x²","3x","x³","3x²")}],test:make30("Ch2 Full","A","B","C","D","A")};
D['math12-ch3']={name:"Math 12 - Ch 3: Integration",topics:[{t:"3.1 Integral",s:"SLO: ∫",test:make20("∫x dx","x²/2+C","x²","2x","x+C","x²/2+C")}],test:make30("Ch3 Full","A","B","C","D","A")};
D['math12-ch4']={name:"Math 12 - Ch 4: ODE",topics:[{t:"4.1 Order",s:"SLO: d²y/dx²",test:make20("Order d²y/dx²","2","1","0","3","2")}],test:make30("Ch4 Full","A","B","C","D","A")};
D['math12-ch5']={name:"Math 12 - Ch 5: Vectors",topics:[{t:"5.1 Dot",s:"SLO: a.b",test:make20("a.b=","|a||b|cosθ","|a||b|sinθ","|a|+|b|","|a|-|b|","|a||b|cosθ")}],test:make30("Ch5 Full","A","B","C","D","A")};
D['math12-ch6']={name:"Math 12 - Ch 6: Statistics",topics:[{t:"6.1 Mean",s:"SLO: Σx/n",test:make20("Mean 2,4,6","4","3","5","6","4")}],test:make30("Ch6 Full","A","B","C","D","A")};
// ========== CS 11 - 10 CHAPTERS ==========
D['cs11-ch1']={name:"CS 11 - Ch 1: Basics",topics:[{t:"1.1 Data",s:"SLO: Data vs Info",test:make20("Processed data","Information","Raw","Binary","None","Information")},{t:"1.2 CPU",s:"SLO: CPU",test:make20("CPU","Central Processing Unit","Computer Unit","Control Unit","None","Central Processing Unit")}],test:make30("Ch1 Full","A","B","C","D","A")};
D['cs11-ch2']={name:"CS 11 - Ch 2: Number System",topics:[{t:"2.1 Binary",s:"SLO: Base2",test:make20("1010 in decimal","10","12","8","2","10")}],test:make30("Ch2 Full","A","B","C","D","A")};
D['cs11-ch3']={name:"CS 11 - Ch 3: Logic Gates",topics:[{t:"3.1 AND",s:"SLO: 1 AND 1",test:make20("1 AND 1","1","0","2","-1","1")}],test:make30("Ch3 Full","A","B","C","D","A")};
D['cs11-ch4']={name:"CS 11 - Ch 4: Algorithms",topics:[{t:"4.1 Flowchart",s:"SLO: Diamond",test:make20("Decision symbol","Diamond","Rectangle","Oval","Parallelogram","Diamond")}],test:make30("Ch4 Full","A","B","C","D","A")};
D['cs11-ch5']={name:"CS 11 - Ch 5: Programming",topics:[{t:"5.1 Python",s:"SLO: print",test:make20("Print Python","print()","echo()","printf()","cout","print()")}],test:make30("Ch5 Full","A","B","C","D","A")};
D['cs11-ch6']={name:"CS 11 - Ch 6: Web",topics:[{t:"6.1 HTML",s:"SLO: h1",test:make20("<h1> is","Heading","Paragraph","Link","Image","Heading")}],test:make30("Ch6 Full","A","B","C","D","A")};
D['cs11-ch7']={name:"CS 11 - Ch 7: Database",topics:[{t:"7.1 SQL",s:"SLO: SELECT",test:make20("Get all","SELECT *","GET *","SHOW *","FETCH *","SELECT *")}],test:make30("Ch7 Full","A","B","C","D","A")};
D['cs11-ch8']={name:"CS 11 - Ch 8: Networks",topics:[{t:"8.1 IP",s:"SLO: Protocol",test:make20("IP","Internet Protocol","Internal Program","Inter Process","None","Internet Protocol")}],test:make30("Ch8 Full","A","B","C","D","A")};
D['cs11-ch9']={name:"CS 11 - Ch 9: Security",topics:[{t:"9.1 Virus",s:"SLO: Malware",test:make20("Virus","Malware","Hardware","Software","None","Malware")}],test:make30("Ch9 Full","A","B","C","D","A")};
D['cs11-ch10']={name:"CS 11 - Ch 10: Ethics",topics:[{t:"10.1 Piracy",s:"SLO: Copyright",test:make20("Copy software","Piracy","Sharing","Backup","Legal","Piracy")}],test:make30("Ch10 Full","A","B","C","D","A")};

// ========== CS 12 - 6 CHAPTERS ==========
D['cs12-ch1']={name:"CS 12 - Ch 1: OOP",topics:[{t:"1.1 Class",s:"SLO: Blueprint",test:make20("Blueprint","Class","Object","Method","Variable","Class")}],test:make30("Ch1 Full","A","B","C","D","A")};
D['cs12-ch2']={name:"CS 12 - Ch 2: Data Structure",topics:[{t:"2.1 Stack",s:"SLO: LIFO",test:make20("LIFO","Stack","Queue","Array","List","Stack")}],test:make30("Ch2 Full","A","B","C","D","A")};
D['cs12-ch3']={name:"CS 12 - Ch 3: Algorithms",topics:[{t:"3.1 Sorting",s:"SLO: O(n²)",test:make20("Worst Bubble","O(n²)","O(n)","O(logn)","O(1)","O(n²)")}],test:make30("Ch3 Full","A","B","C","D","A")};
D['cs12-ch4']={name:"CS 12 - Ch 4: Software Eng",topics:[{t:"4.1 SDLC",s:"SLO: Phases",test:make20("1st SDLC","Requirement","Design","Coding","Testing","Requirement")}],test:make30("Ch4 Full","A","B","C","D","A")};
D['cs12-ch5']={name:"CS 12 - Ch 5: Web Dev",topics:[{t:"5.1 JS",s:"SLO: DOM",test:make20("getElementById","DOM Method","CSS","HTML","API","DOM Method")}],test:make30("Ch5 Full","A","B","C","D","A")};
D['cs12-ch6']={name:"CS 12 - Ch 6: AI",topics:[{t:"6.1 ML",s:"SLO: Subset",test:make20("ML subset of","AI","DB","OS","Network","AI")}],test:make30("Ch6 Full","A","B","C","D","A")};

// ========== DEBUG GAME 20 LEVELS ==========
D['game']={levels:[]};
for(let i=1;i<=20;i++){D['game'].levels.push({q:`Level ${i}: Find Bug!`,code:`def func():\n x = 5\n print(y) # Bug here`,o:["y not defined","Syntax Error","Indentation Error","Runtime Error"],a:"y not defined",hint:"Variable y is not declared before using."})}

// ========== ALL FUNCTIONS + AI BOT ==========
let current=null, score=0, qIndex=0;
function goHome(){document.getElementById('home').innerHTML=Object.keys(D).filter(k=>k!='game').map(k=>`<div class='card'><h3>${D[k].name}</h3><button class='btn' onclick='loadSubject("${k}")'>Open Chapter</button></div>`).join('')+`<div class='card'><h3>🐛 Debug Game</h3><p>20 Coding Levels</p><button class='btn' onclick='loadGame()'>Play Now</button></div>`;document.getElementById('quizBox').style.display='none';document.getElementById('gameBox').style.display='none';document.getElementById('home').style.display='grid'}
function loadSubject(id){current=D[id]; qIndex=0; score=0; document.getElementById('home').style.display='none'; document.getElementById('gameBox').style.display='none'; document.getElementById('quizBox').style.display='block'; document.getElementById('quizBox').innerHTML=`<h2>${current.name}</h2>`+current.topics.map((t,i)=>`<div class='topic'><b>${t.t}</b><p>${t.s}</p><button class='btn btn-small' onclick='startQuiz("${id}",${i},"topic")'>20 MCQs</button><button class='btn btn-small btn-ai' onclick='askAI("${t.t}")'>🤖 Ask AI</button><div id='ai-${i}' class='ai-box'></div></div>`).join('')+`<button class='btn' onclick='startQuiz("${id}",0,"full")'>Full Chapter 30 MCQs</button><button class='btn btn-secondary' onclick='goHome()'>Back to Home</button>`;}
function startQuiz(id,topicIndex,type){let qs=type==='topic'?D[id].topics[topicIndex].test:D[id].test; qIndex=0; score=0; showQ(qs);}
function showQ(qs){if(qIndex>=qs.length){document.getElementById('quizBox').innerHTML=`<h2>Quiz Complete!</h2><h3>Score: ${score}/${qs.length}</h3><button class='btn' onclick='goHome()'>Home</button>`;return;}let q=qs[qIndex];document.getElementById('quizBox').innerHTML=`<h3>${q.q}</h3>`+q.o.map(opt=>`<button class='btn' onclick='check("${opt}","${q.a}",qs)'>${opt}</button>`).join('');}
function check(sel,ans,qs){if(sel===ans)score++;qIndex++;showQ(qs);}
function loadGame(){document.getElementById('home').style.display='none';document.getElementById('quizBox').style.display='none';document.getElementById('gameBox').style.display='block';qIndex=0;score=0;showGame();}
function showGame(){let g=D['game'].levels[qIndex];document.getElementById('gameBox').innerHTML=`<h2>${g.q}</h2><code>${g.code}</code>`+g.o.map(o=>`<button class='btn' onclick='checkGame("${o}","${g.a}")'>${o}</button>`).join('')+`<p id='hint' style='color:#00D9FF;'></p><button class='btn btn-ai' onclick='document.getElementById("hint").innerText="${g.hint}"'>Show Hint</button><button class='btn btn-secondary' onclick='goHome()'>Exit Game</button>`;}
function checkGame(sel,ans){if(sel===ans){score++;qIndex++;if(qIndex<D['game'].levels.length)showGame();else{document.getElementById('gameBox').innerHTML=`<h2>Game Complete!</h2><h3>Final Score: ${score}/20</h3><button class='btn' onclick='goHome()'>Home</button>`;}}else{document.getElementById('hint').innerText="Wrong! Try again or use Hint.";}}
function askAI(topic){let box=document.getElementById(`ai-${topic.split(' ')[0]}`);box.style.display='block';box.innerHTML=`<b>🤖 Gemini AI Tutor:</b><p>Ask about ${topic}</p><input class='ai-input' id='ai-inp' placeholder='e.g. Explain this topic'><button class='btn btn-small' onclick='getAI("${topic}")'>Ask Gemini</button><div id='ai-out'></div>`;}
function getAI(topic){document.getElementById('ai-out').innerText="AI Demo: Add your Gemini API key to get real answers. Topic: "+topic;}
window.onload=goHome;
</script>
</body>
</html>
