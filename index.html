<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstraLearn | Premium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

:root {
  --bg: #0B1120;
  --card: #131C31;
  --accent-cyan: #00D9FF;
  --accent-purple: #7C3AED;
  --text: #E5E7EB;
}
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }
body { background: var(--bg); color: var(--text); }
.header { text-align: center; padding: 40px 20px; }
.header h1 { font-size: 2.5em; font-weight: 700; background: linear-gradient(90deg, #00D9FF, #7C3AED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 25px; padding: 30px; }
.card {
  background: var(--card);
  padding: 25px;
  border-radius: 20px;
  border: 1px solid rgba(124, 58, 237, 0.2);
  box-shadow: 0 0 20px rgba(0, 217, 255, 0.05);
  transition: 0.3s;
}
.card:hover { transform: translateY(-5px); box-shadow: 0 0 30px rgba(0, 217, 255, 0.15); }

.card h2 { color: var(--accent-cyan); font-size: 1.6em; margin-bottom: 15px; }
.card h3 { color: var(--accent-cyan); font-size: 1.4em; margin-bottom: 15px; }

.topic { background: rgba(0, 217, 255, 0.05); padding: 15px; margin: 12px 0; border-radius: 12px; border-left: 3px solid var(--accent-cyan); }
.topic h4 { color: var(--accent-cyan); font-size: 1.1em; font-weight: 600; }
.topic p { margin: 5px 0; font-size: 0.95em; color: #CBD5E1; }

.btn {
  background: linear-gradient(90deg, #7C3AED, #6366F1);
  color: #fff;
  border: none;
  padding: 14px 20px;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  margin-top: 15px;
  font-size: 1em;
  box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
}
.btn:hover { opacity: 0.9; transform: scale(1.02); }
.btn-secondary { background: #374151; box-shadow: none; }
.btn-ai { background: linear-gradient(90deg, #00D9FF, #06B6D4); }

#quizBox, #gameBox { margin:30px; padding:25px; background:var(--card); border-radius:20px; display:none; border:1px solid var(--accent-purple); }
.formula-box { background: rgba(0, 217, 255, 0.05); padding:15px; margin-top:15px; border-radius:12px; border:1px dashed var(--accent-cyan); color: #CBD5E1; }
.ai-box { background: #0B1120; padding:15px; margin-top:15px; border-radius:12px; border:1px solid var(--accent-cyan); }
.ai-input { width:70%; padding:12px; border-radius:8px; border:1px solid #374151; background:#1F2937; color:#fff; }
</style>
</head>
<body>

<div class="header">
  <h1>🚀 AstraLearn</h1>
  <p style="color:#9CA3AF;">Physics, Math, CS - Class 11 & 12</p>
</div>

<div id="home" class="grid">
  <div class="card"><h2>Physics 11</h2><p>6 Chapters + SLO + Formulas</p><button class="btn" onclick="showChapters('phy11')">Start Learning</button></div>
  <div class="card"><h2>Physics 12</h2><p>6 Chapters + SLO + Formulas</p><button class="btn" onclick="showChapters('phy12')">Start Learning</button></div>
  <div class="card"><h2>Math 11</h2><p>6 Chapters</p><button class="btn" onclick="showChapters('math11')">Start Learning</button></div>
  <div class="card"><h2>Math 12</h2><p>6 Chapters</p><button class="btn" onclick="showChapters('math12')">Start Learning</button></div>
  <div class="card"><h2>CS 11</h2><p>6 Chapters</p><button class="btn" onclick="showChapters('cs11')">Start Learning</button></div>
  <div class="card"><h2>CS 12</h2><p>6 Chapters</p><button class="btn" onclick="showChapters('cs12')">Start Learning</button></div>
  <div class="card"><h2>🧩 Debug Game</h2><p>Find the Bug</p><button class="btn" onclick="startDebugGame()">Play Now</button></div>
</div>

<div id="phy11" class="grid" style="display:none;"><button class="btn btn-secondary" onclick="goHome()" style="grid-column:1/-1;">⬅ Back to Home</button></div>
<div id="phy12" class="grid" style="display:none;"><button class="btn btn-secondary" onclick="goHome()" style="grid-column:1/-1;">⬅ Back to Home</button></div>
<div id="math11" class="grid" style="display:none;"><button class="btn btn-secondary" onclick="goHome()" style="grid-column:1/-1;">⬅ Back to Home</button></div>
<div id="math12" class="grid" style="display:none;"><button class="btn btn-secondary" onclick="goHome()" style="grid-column:1/-1;">⬅ Back to Home</button></div>
<div id="cs11" class="grid" style="display:none;"><button class="btn btn-secondary" onclick="goHome()" style="grid-column:1/-1;">⬅ Back to Home</button></div>
<div id="cs12" class="grid" style="display:none;"><button class="btn btn-secondary" onclick="goHome()" style="grid-column:1/-1;">⬅ Back to Home</button></div>

<div id="quizBox"></div>
<div id="gameBox"></div>

<script>
function showChapters(id) {
  document.getElementById('home').style.display = 'none';
  document.getElementById(id).style.display = 'grid';
  loadContent(id);
}
function goHome() {
  document.getElementById('home').style.display = 'grid';
  ['phy11','phy12','math11','math12','cs11','cs12'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('quizBox').style.display = 'none';
  document.getElementById('gameBox').style.display = 'none';
}

let currentQuizQuestions = [];
let userQuizAnswers = {};

const contentData = {
  'phy11-ch3': {name:"Chapter 3: Motion and Force",
    topics:[
      {t:"3.1 Equations of Motion",s:"SLO: v=u+at, s=ut+½at²", ex:"Example: u=0,a=2,t=5"},
      {t:"3.2 Newton's Laws",s:"SLO: State 3 laws.", ex:"Example: F=ma, Rocket"},
      {t:"3.3 Momentum",s:"SLO: p=mv, J=F·t", ex:"Example: Ball hit"}
    ],
    formulas:["v=u+at","s=ut+1/2at²","F=ma","p=mv"],
    test:[{q:"1st Equation?",o:["v=u+at","s=vt"],a:"v=u+at"}]
  },
  'phy11-ch4': {name:"Chapter 4: Work and Energy",
    topics:[
      {t:"4.1 Work",s:"SLO: W=Fdcosθ", ex:"Example: Pulling box"}
    ],
    formulas:["W=Fdcosθ","KE=1/2mv²"],
    test:[{q:"Work formula?",o:["W=Fdcosθ","P=W/t"],a:"W=Fdcosθ"}]
  },
  'phy11-ch1': {name:"Chapter 1: Measurements", topics:[{t:"1.1 Physical Quantities",s:"SLO: Define base and derived", ex:"Example: Meter, Kg"}], formulas:["ΔA = Ameasured - Aactual"], test:[{q:"SI unit of length?",o:["Meter","Kg"],a:"Meter"}]},
  'phy11-ch2': {name:"Chapter 2: Vectors", topics:[{t:"2.1 Vector Addition",s:"SLO: Add vectors", ex:"Example: Boat crossing"}], formulas:["R = √(A²+B²+2ABcosθ)"], test:[{q:"Vector has?",o:["Mag+Dir","Only Mag"],a:"Mag+Dir"}]},
  'phy11-ch5': {name:"Chapter 5: Work & Energy", topics:[{t:"5.1 Work",s:"SLO: W = Fdcosθ", ex:"Example: Lifting"}], formulas:["W=Fdcosθ"], test:[{q:"Work formula?",o:["W=Fdcosθ","P=W/t"],a:"W=Fdcosθ"}]},
  'phy11-ch6': {name:"Chapter 6: Circular Motion", topics:[{t:"6.1 Centripetal Force",s:"SLO: F = mv²/r", ex:"Example: Car turn"}], formulas:["Fc=mv²/r"], test:[{q:"Centripetal force?",o:["mv²/r","mg"],a:"mv²/r"}]},
  'phy12-ch1': {name:"Chapter 1: Electrostatics", topics:[{t:"1.1 Coulomb's Law",s:"SLO: F=kq1q2/r²", ex:"Example: 2 charges"}], formulas:["F=kq1q2/r²"], test:[{q:"Coulomb's Law?",o:["F=kq1q2/r^2","F=ma"],a:"F=kq1q2/r^2"}]},
  'phy12-ch2': {name:"Chapter 2: Current Electricity", topics:[{t:"2.1 Ohm's Law",s:"SLO: V=IR", ex:"Example: Bulb"}], formulas:["V=IR"], test:[{q:"Ohm's Law?",o:["V=IR","F=ma"],a:"V=IR"}]},
  'phy12-ch3': {name:"Chapter 3: Electromagnetism", topics:[{t:"3.1 Magnetic Field",s:"SLO: F=BILsinθ", ex:"Example: Motor"}], formulas:["F=BILsinθ"], test:[{q:"B field unit?",o:["Tesla","Weber"],a:"Tesla"}]},
  'phy12-ch4': {name:"Chapter 4: EMI", topics:[{t:"4.1 Faraday's Law",s:"SLO: ε=-dΦ/dt", ex:"Example: Generator"}], formulas:["ε=-NΔΦ/Δt"], test:[{q:"Faraday Law?",o:["ε=-dΦ/dt","V=IR"],a:"ε=-dΦ/dt"}]},
  'phy12-ch5': {name:"Chapter 5: Modern Physics", topics:[{t:"5.1 Photoelectric",s:"SLO: E=hf", ex:"Example: Solar cell"}], formulas:["E=hf"], test:[{q:"Photoelectric by?",o:["Einstein","Newton"],a:"Einstein"}]},
  'phy12-ch6': {name:"Chapter 6: Nuclear", topics:[{t:"6.1 Nucleus",s:"SLO: N=N0e^-λt", ex:"Example: Radioactive"}], formulas:["N=N0e^(-λt)"], test:[{q:"Nucleus has?",o:["p+n","p+e"],a:"p+n"}]},
  'math11-ch1': {name:"Chapter 1: Sets", topics:[{t:"1.1 Types",s:"SLO: Define set", ex:"Example: {1,2,3}"}], formulas:["n(A∪B)=n(A)+n(B)-n(A∩B)"], test:[{q:"Empty set?",o:["{}","0"],a:"{}"}]},
  'math12-ch2': {name:"Chapter 2: Derivatives", topics:[{t:"2.1 d/dx",s:"SLO: Differentiate", ex:"Example: d/dx(x²)"}], formulas:["d/dx(x^n)=nx^(n-1)"], test:[{q:"d/dx(x²)=?",o:["x","2x"],a:"2x"}]},
  'cs11-ch3': {name:"Chapter 3: Python", topics:[{t:"3.1 Variables",s:"SLO: x=5", ex:"Example: print(x)"}], formulas:["print()"], test:[{q:"print(2+2)=?",o:["4","22"],a:"4"}]},
  'cs12-ch1': {name:"Chapter 1: OOP", topics:[{t:"1.1 Class",s:"SLO: class Car", ex:"Example: object"}], formulas:["class Name:"], test:[{q:"OOP pillar?",o:["Inheritance","Loop"],a:"Inheritance"}]},
};

function loadContent(subject) {
  let container = document.getElementById(subject);
  container.innerHTML = '<button class="btn btn-secondary" onclick="goHome()" style="grid-column:1/-1;">⬅ Back to Home</button>';

  for(let i=1; i<=6; i++){
    let key = `${subject}-ch${i}`;
    let data = contentData[key];
    if(!data) continue;

    let card = `
    <div class="card">
      <h3>${data.name}</h3>
      <div id="${key}-topics"></div>
      <button class="btn" onclick="startTest('${key}')">📝 Chapter Test: 30 SLO MCQs</button>
      <button class="btn btn-ai" onclick="openAIBot('${key}')">🤖 Ask AI Tutor</button>
      <div class="formula-box"><b>Formulas:</b> <div id="${key}-formulas"></div></div>
      <div id="${key}-ai" class="ai-box" style="display:none;">
        <input id="${key}-ai-input" class="ai-input" placeholder="Poochein: Newton 2nd law?">
        <button class="btn btn-ai" onclick="askAI('${key}')">Send</button>
        <div id="${key}-ai-reply" style="margin-top:10px;"></div>
      </div>
    </div>`;
    container.innerHTML += card;
  }

  for(let key in contentData){
    if(key.startsWith(subject)){
      let data = contentData[key];
      document.getElementById(key + '-topics').innerHTML = data.topics.map(t=>`<div class="topic"><h4>${t.t}</h4><p><b>${t.s}</b></p><p><b>${t.ex}</b></p></div>`).join('');
      document.getElementById(key + '-formulas').innerHTML = data.formulas.map(f=>`• ${f}`).join('<br>');
    }
  }
}

function openAIBot(key){ document.getElementById(key + '-ai').style.display = document.getElementById(key + '-ai').style.display === 'none'? 'block' : 'none'; }
function askAI(key){
  let question = document.getElementById(key + '-ai-input').value;
  let replyDiv = document.getElementById(key + '-ai-reply');
  if(question.trim() === '') return;
  replyDiv.innerHTML = `<p><b>Tum:</b> ${question}</p><p><b>AI:</b> ${contentData[key].name} mein ye aata hai. Formula: ${contentData[key].formulas[0]}</p>`;
  document.getElementById(key + '-ai-input').value = '';
}

function startTest(chapterKey) {
  let quizContainer = document.getElementById("quizBox");
  quizContainer.style.display = "block";
  quizContainer.scrollIntoView({ behavior: 'smooth' });
  currentQuizQuestions = contentData[chapterKey].test;
  userQuizAnswers = {};
  let html = `<h2 style="color:var(--accent-cyan);">${contentData[chapterKey].name} Test</h2>`;
  currentQuizQuestions.forEach((item, index) => {
    html += `<div style="margin-bottom: 20px;"><h4>Q${index+1}: ${item.q}</h4>`;
    item.o.forEach(opt => {
      html += `<label style="display:block; padding:12px; background:#1F2937; margin:8px 0; border-radius:8px;">
        <input type="radio" name="q_${index}" onclick="userQuizAnswers[${index}]='${opt}'"> ${opt}
      </label>`;
    });
    html += `</div>`;
  });
  html += `<button class="btn" onclick="submitQuiz()">Submit Test</button><div id="quiz-final-result"></div>`;
  quizContainer.innerHTML = html;
}

function submitQuiz() {
  let score = 0;
  currentQuizQuestions.forEach((item, index) => { if (userQuizAnswers[index] === item.a) score++; });
  let percent = ((score / currentQuizQuestions.length) * 100).toFixed(0);
  document.getElementById("quiz-final-result").innerHTML = `<div style="margin-top:20px; padding:15px; background:rgba(124,58,237,0.2); border:2px solid var(--accent-purple); border-radius:12px;"><h3>Your Score: ${score} / ${currentQuizQuestions.length} = ${percent}%</h3></div>`;
}

function startDebugGame() {
  document.getElementById('home').style.display = 'none';
  let gameBox = document.getElementById('gameBox');
  gameBox.style.display = 'block';
  gameBox.innerHTML = `<h2 style="color:var(--accent-cyan);">🧩 Debug Game - Level 1</h2><p><b>Bug:</b> Is code mein error hai:</p><pre style="background:#000; padding:15px; border-radius:8px;">for i in range(10)\n print(i)</pre><button class="btn" onclick="alert('Sahi! Colon missing tha :)')">A) for i in range(10):</button><button class="btn btn-secondary" onclick="goHome()" style="margin-top:20px;">⬅ Back to Home</button>`;
}
</script>

</body>
</html>
