<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra Learn</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
 body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: 'Segoe UI', sans-serif; }
.glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.2); }
.btn { padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.btn-primary { background: linear-gradient(90deg, #0ea5e9, #0284c7); color: white; }
.btn-primary:hover { transform: scale(1.05); }
.btn-subject { width: 100%; padding: 1.2rem; border-radius: 1rem; background: rgba(51, 65, 85, 0.6); text-align: left; }
.btn-subject:hover { background: linear-gradient(90deg, #0ea5e9, #06b6d4); transform: translateY(-3px); }
.btn-option { width: 100%; text-align: left; padding: 1rem; margin: 0.5rem 0; border-radius: 0.75rem; background: #334155; border: 2px solid transparent; }
.btn-option:hover { background: #475569; border-color: #0ea5e9; }
.correct { background: rgba(34,197,94,0.3)!important; border: 2px solid #22c55e!important; }
.wrong { background: rgba(239,68,68,0.3)!important; border: 2px solid #ef4444!important; }
.hidden { display: none; }
</style>
</head>
<body class="text-slate-200 min-h-screen">

<div class="max-w-7xl mx-auto p-4">
 <header class="glass p-4 rounded-2xl mb-6 flex justify-between items-center">
  <h1 class="text-3xl font-bold text-cyan-400">Astra Learn</h1>
  <button onclick="showHome()" class="btn btn-primary">Home</button>
 </header>

 <div id="home">
  <div class="glass p-8 rounded-2xl mb-6 text-center">
   <h2 class="text-4xl font-bold mb-2">Welcome!</h2>
   <p class="text-slate-400">Physics, Maths, CS - 11th & 12th + Game + AI Bot</p>
  </div>
  <div class="grid md:grid-cols-3 gap-6">
   <button onclick="showSubjects('PHY11')" class="btn-subject">⚛️ Physics 11</button>
   <button onclick="showSubjects('PHY12')" class="btn-subject">⚛️ Physics 12</button>
   <button onclick="showSubjects('MATHS11')" class="btn-subject">📊 Maths 11</button>
   <button onclick="showSubjects('MATHS12')" class="btn-subject">📊 Maths 12</button>
   <button onclick="showSubjects('CS11')" class="btn-subject">💻 CS 11</button>
   <button onclick="showSubjects('CS12')" class="btn-subject">💻 CS 12</button>
  </div>
  <button onclick="showGame()" class="btn-subject w-full mt-6 bg-green-800">🎮 Game - 15 Levels</button>
  <button onclick="showAiBot()" class="btn-subject w-full mt-4 bg-purple-800">🤖 AI Bot</button>
 </div>

 <div id="chapterMenu" class="hidden"></div>
 <div id="quizBox" class="hidden"></div>
 <div id="gameBox" class="hidden"></div>
 <div id="aiBot" class="hidden"></div>
</div>

<script>
const QUIZ_DATA = {
"PHY11": { name: "Physics 11th", "CH1": { name: "CH1: Measurements", formula: "ΔA = |Aavg - A|", topics: { "MCQs": [
{q: "Q1: SI unit of length?", opts: ["kg","m","s","A"], ans: 1}, {q: "Q2: 1 micron =?", opts: ["10^-3 m","10^-6 m","10^-9 m","10^-12 m"], ans: 1},
{q: "Q3: LC of Vernier?", opts: ["0.1cm","0.01cm","0.001cm","0.1mm"], ans: 1}, {q: "Q4: Sig figs 0.0050?", opts: ["1","2","3","4"], ans: 1},
{q: "Q5: Dim of Force?", opts: ["MLT-2","ML2T-2","MLT-1","M2LT-2"], ans: 0}
]}}, "CH2": { name: "CH2: Vectors", formula: "R = sqrt(A^2+B^2+2ABcosθ)", topics: { "MCQs": [
{q: "Q1: Scalar?", opts: ["Force","Velocity","Mass","Acceleration"], ans: 2}, {q: "Q2: Vector?", opts: ["Time","Mass","Temperature","Displacement"], ans: 3}
]}} },

"PHY12": { name: "Physics 12th", "CH1": { name: "CH1: Electrostatics", formula: "F = kq1q2/r^2", topics: { "MCQs": [
{q: "Q1: Unit q?", opts: ["N","C","V","J"], ans: 1}, {q: "Q2: k =?", opts: ["9e9","8.99e9","9e8","8.99e8"], ans: 1}
]}} },

"MATHS11": { name: "Maths 11th", "CH1": { name: "CH1: Sets", formula: "n(A∪B) = nA+nB-nA∩B", topics: { "MCQs": [
{q: "Q1: Empty set?", opts: ["{}","{0}","0","1"], ans: 0}, {q: "Q2: Universal?", opts: ["U","A","B","C"], ans: 0}
]}} },

"MATHS12": { name: "Maths 12th", "CH1": { name: "CH1: Relations", formula: "f(g(x))", topics: { "MCQs": [
{q: "Q1: One-one?", opts: ["Unique image","Same image","Zero","Inf"], ans: 0}, {q: "Q2: Onto?", opts: ["Range=Codomain","Range⊂Codomain","Range>Codomain","None"], ans: 0}
]}} },

"CS11": { name: "CS 11th", "CH1": { name: "CH1: Intro CS", formula: "Data + Instructions", topics: { "MCQs": [
{q: "Q1: CPU?", opts: ["Central Processing Unit","Computer Processing Unit","Central Program Unit","Control Processing Unit"], ans: 0}
]}} },

"CS12": { name: "CS 12th", "CH1": { name: "CH1: Data Structures", formula: "Stack, Queue", topics: { "MCQs": [
{q: "Q1: LIFO?", opts: ["Queue","Stack","Array","Tree"], ans: 1}, {q: "Q2: FIFO?", opts: ["Queue","Stack","Array","Tree"], ans: 0}
]}} },

"GAME": {
    name: "Game",
    levels: [
      {level: 1, q: "Level 1: 2+2?", opts: ["3","4","5","6"], ans: 1}, {level: 2, q: "Level 2: 5*5?", opts: ["20","25","30","35"], ans: 1},
      {level: 3, q: "Level 3: 10/2?", opts: ["3","4","5","6"], ans: 2}
    ]
  },
"AI_BOT": {
    name: "AI Bot",
    responses: {
      "hello": "Hello! Kya help chahiye? Physics, Maths ya CS?",
      "physics": "Physics me konsa chapter padhna hai?",
      "maths": "Maths me konsa chapter?",
      "cs": "CS me konsa chapter?",
      "game": "Game khelne ke liye Game button dabao",
      "default": "Samjha nahi. 'physics', 'maths', 'cs', 'game' likho"
    }
  }
};

// ===== JS FUNCTIONS =====
let currentSubject="", currentChapter="", currentQ=0, score=0, gameLevel=0;

function showHome(){
 ['home','chapterMenu','quizBox','gameBox','aiBot'].forEach(id=>document.getElementById(id).classList.add('hidden'));
 document.getElementById('home').classList.remove('hidden');
}

function showSubjects(sub){
 currentSubject = sub;
 let menu = document.getElementById('chapterMenu');
 menu.innerHTML = `<h2 class="text-2xl font-bold mb-4">${QUIZ_DATA[sub].name}</h2><div class="grid md:grid-cols-2 gap-4">`;
 for(let ch in QUIZ_DATA[sub]){
  if(ch.startsWith("CH")){
   menu.innerHTML += `<button onclick="startQuiz('${sub}','${ch}')" class="btn-subject">
   <h3 class="font-bold text-lg">${QUIZ_DATA[sub][ch].name}</h3>
   <p class="text-sm text-cyan-300">Formula: ${QUIZ_DATA[sub][ch].formula}</p>
   </button>`;
  }
 }
 menu.innerHTML += `</div>`;
 showDiv('chapterMenu');
}

function startQuiz(sub, ch){
 currentSubject=sub; currentChapter=ch; currentQ=0; score=0;
 showDiv('quizBox'); loadQuestion();
}

function loadQuestion(){
 let qData = QUIZ_DATA[currentSubject][currentChapter].topics.MCQs[currentQ];
 document.getElementById('quizBox').innerHTML = `
  <div class="glass p-6 rounded-2xl">
   <h3 class="text-xl mb-2">${QUIZ_DATA[currentSubject][currentChapter].name}</h3>
   <p class="text-sm text-cyan-300 mb-4">Formula: ${QUIZ_DATA[currentSubject][currentChapter].formula}</p>
   <h4 class="text-lg mb-4">${qData.q}</h4>
   ${qData.opts.map((opt,i)=>`<button onclick="checkAns(${i})" class="btn-option">${i+1}. ${opt}</button>`).join('')}
   <p class="mt-4">Question ${currentQ+1} | Score: ${score}</p>
  </div>
 `;
}

function checkAns(i){
 let qData = QUIZ_DATA[currentSubject][currentChapter].topics.MCQs[currentQ];
 let buttons = document.querySelectorAll('.btn-option');
 buttons.forEach(btn => btn.disabled = true);

 if(i==qData.ans){
  score++;
  buttons[i].classList.add('correct');
 } else {
  buttons[i].classList.add('wrong');
  buttons[qData.ans].classList.add('correct');
 }

 setTimeout(()=>{
  currentQ++;
  if(currentQ < qData.length) loadQuestion();
  else alert(`Quiz Done! Score: ${score}`);
 }, 1000);
}

function showGame(){
 gameLevel = 0;
 showDiv('gameBox'); loadGameLevel();
}

function loadGameLevel(){
 let qData = QUIZ_DATA.GAME.levels[gameLevel];
 document.getElementById('gameBox').innerHTML = `
  <div class="glass p-6 rounded-2xl">
   <h3 class="text-2xl mb-4 text-green-400">${qData.q}</h3>
   ${qData.opts.map((opt,i)=>`<button onclick="checkGame(${i})" class="btn-option">${i+1}. ${opt}</button>`).join('')}
  </div>
 `;
}

function checkGame(i){
 let qData = QUIZ_DATA.GAME.levels[gameLevel];
 if(i==qData.ans){
  gameLevel++;
  if(gameLevel < QUIZ_DATA.GAME.levels.length) loadGameLevel();
  else alert('🎉 Game Complete!');
 } else {
  alert('Wrong! Try Again');
  loadGameLevel();
 }
}

function showAiBot(){
 showDiv('aiBot');
 document.getElementById('aiBot').innerHTML = `
  <div class="glass p-6 rounded-2xl">
   <h2 class="text-2xl mb-4">🤖 AI Bot</h2>
   <div id="chatBox" class="h-64 overflow-y-auto mb-4 p-4 bg-slate-800 rounded-lg"></div>
   <input type="text" id="userInput" placeholder="Type: hello, physics, maths" class="w-full p-3 rounded-lg bg-slate-700 mb-2 text-white">
   <button onclick="sendMsg()" class="btn btn-primary w-full">Send</button>
  </div>
 `;
}

function sendMsg(){
 let input = document.getElementById('userInput').value.toLowerCase();
 let chatBox = document.getElementById('chatBox');
 chatBox.innerHTML += `<p class="text-right mb-2">You: ${input}</p>`;
 let reply = QUIZ_DATA.AI_BOT.responses[input] || QUIZ_DATA.AI_BOT.responses.default;
 chatBox.innerHTML += `<p class="text-left mb-2 text-cyan-300">Bot: ${reply}</p>`;
 document.getElementById('userInput').value = '';
}

function showDiv(id){
 ['home','chapterMenu','quizBox','gameBox','aiBot'].forEach(d=>document.getElementById(d).classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
}
</script>
</body>
</html>
