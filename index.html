const GAME_DATA=[

{lv:2,q:"Level 2: Which type stores True/False?",o:["int","string","boolean","float"],a:2,h:"Boolean = true/false"},

let curSub="",curCh="",curQ=0,score=0,gameLv=0;
function goHome(){["home","chapBox","quizBox","gameBox","botBox"].forEach(id=>document.getElementById(id).classList.add("hidden"));document.getElementById("home").classList.remove("hidden");}
function renderSubs(){
let grid=document.getElementById("subGrid");grid.innerHTML="";
for(let k in DATA){grid.innerHTML+=`<button onclick="openChapters('${k}')" class="glass card p-6 text-left"><div class="text-3xl mb-2">${k.includes('PHY')?'⚛️':k.includes('MATHS')?'📊':'💻'}</div><h3 class="font-bold text-lg">${DATA[k].name}</h3><p class="text-sm text-slate-400">6 Chapters | 60 MCQs</p></button>`;}
}
renderSubs();
function openChapters(sub){
curSub=sub;let box=document.getElementById("chapBox");
box.innerHTML=`<h2 class="text-2xl font-bold mb-5">${DATA[sub].name}</h2><div class="grid md:grid-cols-2 gap-4">`+Object.keys(DATA[sub].ch).map(ch=>`<button onclick="startQuiz('${sub}','${ch}')" class="glass card p-5 text-left"><h3 class="font-bold">${DATA[sub].ch[ch].name}</h3><p class="text-xs text-cyan-300 mt-1">${DATA[sub].ch[ch].form}</p><p class="text-xs mt-2 text-slate-400">10 MCQs</p></button>`).join("")+`</div>`;
document.getElementById("home").classList.add("hidden");box.classList.remove("hidden");
}
function startQuiz(sub,ch){curSub=sub;curCh=ch;curQ=0;score=0;document.getElementById("chapBox").classList.add("hidden");document.getElementById("quizBox").classList.remove("hidden");loadQ();}
function loadQ(){
let d=DATA[curSub].ch[curCh];let q=d.qs[curQ];
document.getElementById("quizBox").innerHTML=`<div class="glass p-6"><div class="flex justify-between mb-2"><h3 class="font-bold">${d.name}</h3><span>${curQ+1}/10</span></div><p class="text-xs text-cyan-300 mb-3">Formula: ${d.form}</p><div class="p-3 mb-3 bg-yellow-500/10 border border-yellow-500/30 rounded-lg text-sm text-yellow-200 hidden" id="hint">💡 ${d.hint}</div><button onclick="document.getElementById('hint').classList.toggle('hidden')" class="text-xs px-3 py-1 bg-yellow-600 rounded-full mb-4">Show Hint</button><h4 class="text-xl font-bold mb-4">${q.q}</h4>${q.o.map((opt,i)=>`<button onclick="check(${i})" id="o${i}" class="btn-opt">${i+1}. ${opt}</button>`).join("")}</div>`;
}
function check(i){
let q=DATA[curSub].ch[curCh].qs[curQ];document.querySelectorAll(".btn-opt").forEach(b=>b.disabled=true);
if(i==q.a){document.getElementById("o"+i).classList.add("correct");score++}
else{document.getElementById("o"+i).classList.add("wrong");document.getElementById("o"+q.a).classList.add("correct")}
setTimeout(()=>{curQ++; if(curQ<10) loadQ(); else {document.getElementById("quizBox").innerHTML=`<div class="glass p-10 text-center"><h2 class="text-4xl font-bold mb-3">Score: ${score}/10</h2><p class="mb-6">${score>=7?'Excellent!':'Keep Practicing!'}</p><button onclick="openChapters('${curSub}')" class="px-6 py-3 bg-sky-500 rounded-full font-bold">Back to Chapters</button></div>`}},900);
}
function openGame(){goHome();document.getElementById("home").classList.add("hidden");gameLv=0;document.getElementById("gameBox").classList.remove("hidden");loadGame();}
function loadGame(){
let g=GAME_DATA[gameLv];
document.getElementById("gameBox").innerHTML=`<div class="glass p-8"><h2 class="text-2xl font-bold mb-2">Coding Game - Level ${g.lv}/5</h2><p class="text-lg font-bold mb-4">${g.q}</p><div class="p-3 mb-3 bg-yellow-500/10 border border-yellow-500/30 rounded-lg text-sm text-yellow-200 hidden" id="ghint">💡 ${g.h}</div><button onclick="document.getElementById('ghint').classList.toggle('hidden')" class="text-xs px-3 py-1 bg-yellow-600 rounded-full mb-4">Show Hint</button>${g.o.map((opt,i)=>`<button onclick="checkGame(${i})" id="go${i}" class="btn-opt">${opt}</button>`).join("")}</div>`;
}
function checkGame(i){
let g=GAME_DATA[gameLv];
if(i==g.a){document.getElementById("go"+i).classList.add("correct"); setTimeout(()=>{gameLv++; if(gameLv<5) loadGame(); else document.getElementById("gameBox").innerHTML=`<div class="glass p-10 text-center"><h2 class="text-4xl font-bold">🎉 You Won All 5 Levels!</h2><button onclick="goHome()" class="mt-5 px-6 py-3 bg-sky-500 rounded-full font-bold">Go Home</button></div>`},800)}
else{document.getElementById("go"+i).classList.add("wrong");document.getElementById("go"+g.a).classList.add("correct"); setTimeout(()=>loadGame(),1000)}
}
function openBot(){
goHome();document.getElementById("home").classList.add("hidden");document.getElementById("botBox").classList.remove("hidden");
document.getElementById("botBox").innerHTML=`<div class="glass p-6"><h2 class="text-2xl font-bold mb-4">🤖 Gemini AI Tutor</h2><div id="chat" class="h-[400px] overflow-y-auto mb-4 space-y-2"></div><div class="flex gap-2"><input id="inp" placeholder="Ask any question..." class="flex-1 p-3 rounded-full bg-[#1e293b] border border-slate-600"/><button onclick="sendBot()" class="px-6 py-3 rounded-full bg-sky-500 font-bold">Send</button></div></div>`;
}
async function sendBot(){
let input=document.getElementById("inp");let msg=input.value.trim();if(!msg) return;
let chat=document.getElementById("chat");
chat.innerHTML+=`<div class="text-right"><span class="inline-block bg-sky-500 px-4 py-2 rounded-2xl">${msg}</span></div>`;input.value="";
if(API_KEY=="YOUR_GEMINI_API_KEY"){chat.innerHTML+=`<div class="text-left"><span class="inline-block bg-[#1e293b] px-4 py-2 rounded-2xl">Add your Gemini API Key. Get free key from aistudio.google.com/app/apikey</span></div>`;return;}
try{
let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:msg}]}]})});
let data=await res.json();let reply=data.candidates[0].content.parts[0].text;
chat.innerHTML+=`<div class="text-left"><span class="inline-block bg-[#1e293b] px-4 py-2 rounded-2xl">${reply}</span></div>`;chat.scrollTop=chat.scrollHeight;
}catch(e){chat.innerHTML+=`<div class="text-left"><span class="inline-block bg-red-500/20 border border-red-500 px-4 py-2 rounded-2xl">Error: ${e.message}</span></div>`}
}
</script>
