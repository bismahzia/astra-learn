 currentSubject=sub; currentChapter=ch; currentQ=0; score=0;
 showDiv('quizBox'); loadQuestion();
}

function loadQuestion(){
 let qData = QUIZ_DATA[currentSubject][currentChapter].topics.MCQs[currentQ];
 let hint = QUIZ_DATA[currentSubject][currentChapter].hint;
 document.getElementById('quizBox').innerHTML = `
  <div class="glass p-6 rounded-2xl">
   <h3 class="text-xl mb-2">${QUIZ_DATA[currentSubject][currentChapter].name}</h3>
   <p class="text-sm text-cyan-300 mb-2">Formula: ${QUIZ_DATA[currentSubject][currentChapter].formula}</p>
   <button onclick="toggleHint()" class="btn bg-yellow-600 mb-3">💡 Hint</button>
   <div id="hintBox" class="hint-box hidden">${hint}</div>
   <h4 class="text-lg mb-4">${qData.q}</h4>
   ${qData.opts.map((opt,i)=>`<button onclick="checkAns(${i})" class="btn-option" id="opt${i}">${i+1}. ${opt}</button>`).join('')}
   <p class="mt-4">Question ${currentQ+1} / 20 | Score: ${score}</p>
  </div>
 `;
}

function toggleHint(){
 document.getElementById('hintBox').classList.toggle('hidden');
}

function checkAns(i){
 let qData = QUIZ_DATA[currentSubject][currentChapter].topics.MCQs[currentQ];
 let buttons = document.querySelectorAll('.btn-option');
 buttons.forEach(btn => btn.disabled = true);

 if(i==qData.ans){
  score++;
  buttons[i].classList.add('correct');
 } else {
  buttons[i].classList.add('wrong');
  buttons[qData.ans].classList.add('correct');
 }

 setTimeout(()=>{
  currentQ++;
  if(currentQ < QUIZ_DATA[currentSubject][currentChapter].topics.MCQs.length) loadQuestion();
  else showResult();
 }, 1000);
}

function showResult(){
 document.getElementById('quizBox').innerHTML = `
  <div class="glass p-6 rounded-2xl text-center">
   <h2 class="text-2xl font-bold mb-4">Quiz Completed!</h2>
   <p class="text-4xl mb-2">${score}/20</p>
   <p class="text-slate-400 mb-4">${score >= 16? 'Excellent!' : score >= 12? 'Good Job!' : 'Keep Practicing!'}</p>
   <button onclick="showSubjects('${currentSubject}')" class="btn btn-primary">Back to Chapters</button>
  </div>
 `;
}

  alert('Wrong Answer! Try Again');
  loadGameLevel();
 }
}
