<!-- UI SECTION -->
<div id="app">
  <h1>📚 FULL MIX QUIZ SYSTEM</h1>
  <div id="menu">
    <button onclick="startQuiz('allmix-test')">Start 50 MCQ Full Test</button>
    <button onclick="startQuiz('cs12-buggame')">Play Bug Cracker Game</button>
    <button onclick="showChapters()">All Chapters</button>
  </div>

  <div id="quizBox" style="display:none;">
    <h2 id="qTitle"></h2>
    <p id="question"></p>
    <div id="options"></div>
    <button onclick="submitAns()">Submit</button>
    <button onclick="showHint()">💡 Hint</button>
    <p id="hintText" style="display:none;color:yellow;"></p>
    <p id="result"></p>
    <p id="progress"></p>
  </div>

  <div id="finalResult" style="display:none;"></div>
</div>

<script>
let currentChapter, currentIndex=0, score=0, selectedAns="", wrongList=[];

function showChapters(){
  let menu = document.getElementById('menu');
  menu.innerHTML = "<h3>Select Chapter:</h3>";
  ALL_CHAPTERS.forEach(key=>{
    menu.innerHTML += `<button onclick="startQuiz('${key}')">${D[key].name}</button><br><br>`;
  });
}

function startQuiz(key){
  currentChapter = key;
  currentIndex = 0; score = 0; wrongList = [];
  document.getElementById('menu').style.display='none';
  document.getElementById('quizBox').style.display='block';
  document.getElementById('finalResult').style.display='none';
  loadQ();
}

function loadQ(){
  let topic = D[currentChapter].topics[0];
  let q = topic.test[currentIndex];
  if(!q){ showFinal(); return; }

  document.getElementById('qTitle').innerText = `${D[currentChapter].name} - Q${currentIndex+1}`;
  document.getElementById('question').innerText = q.q;
  document.getElementById('progress').innerText = `Progress: ${currentIndex+1}/${topic.test.length} | Score: ${score}`;
  document.getElementById('hintText').style.display='none';
  document.getElementById('result').innerText='';

  let optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.o.forEach(opt=>{
    optDiv.innerHTML += `<label><input type="radio" name="ans" value="${opt}"> ${opt}</label><br>`;
  });
}

function submitAns(){
  let ans = document.querySelector('input[name="ans"]:checked');
  if(!ans){ alert("Option select karo"); return; }
  selectedAns = ans.value;
  let q = D[currentChapter].topics[0].test[currentIndex];

  if(selectedAns === q.a){
    score++; document.getElementById('result').innerHTML="✅ Correct!";
  } else {
    document.getElementById('result').innerHTML=`❌ Wrong! Correct: ${q.a}`;
    wrongList.push({q:q.q, a:q.a});
  }
  currentIndex++;
  setTimeout(loadQ, 1200);
}

function showHint(){
  let q = D[currentChapter].topics[0].test[currentIndex];
  if(q.hint){
    document.getElementById('hintText').innerText = "Hint: " + q.hint;
    document.getElementById('hintText').style.display='block';
  }
}

function showFinal(){
  document.getElementById('quizBox').style.display='none';
  let total = D[currentChapter].topics[0].test.length;
  let per = (score/total)*100;
  let res = `<h2>🎉 Quiz Complete</h2>
  <p>Score: ${score}/${total}</p>
  <p>Percentage: ${per.toFixed(2)}%</p>
  ${per>=60?'<p style="color:green;">PASSED</p>':'<p style="color:red;">FAILED</p>'}`;

  if(wrongList.length>0){
    res += "<h3>Review:</h3>";
    wrongList.forEach(w=> res+=`<p>Q: ${w.q} <br> Ans: ${w.a}</p>`);
  }
  res += `<button onclick="location.reload()">Restart</button>`;
  document.getElementById('finalResult').innerHTML=res;
  document.getElementById('finalResult').style.display='block';
}
</script>

</body>
</html>
