<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra Learn - Part 1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: 'Segoe UI', sans-serif; }
.glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
.btn { padding: 0.5rem 1rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; }
.btn-primary { background: #06b6d4; color: white; }
.btn-option { width: 100%; text-align: left; padding: 0.75rem; margin: 0.5rem 0; border-radius: 0.5rem; background: #334155; border: 1px solid #475569; }
.correct { background: rgba(34,197,94,0.3)!important; border-color: #22c55e!important; }
.wrong { background: rgba(239,68,68,0.3)!important; border-color: #ef4444!important; }
.hidden { display: none; }
</style>
</head>
<body class="text-slate-100 min-h-screen">

<div class="max-w-6xl mx-auto p-4">
    <header class="glass p-4 rounded-2xl mb-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-cyan-400">Astra Learn 🚀</h1>
        <button onclick="showHome()" class="btn btn-primary">Home</button>
    </header>

    <div id="home">
        <div class="glass p-6 rounded-2xl mb-4 text-center">
            <h2 class="text-3xl font-bold mb-2">Astra Learn</h2>
            <p class="text-slate-400">Physics | Mathematics | Computer Science</p>
        </div>
        <div class="grid md:grid-cols-3 gap-4">
            <button onclick="showSubjects('Physics')" class="glass p-6 rounded-2xl hover:bg-cyan-500/10"><h3 class="text-xl font-bold">Physics</h3></button>
            <button onclick="showSubjects('Maths')" class="glass p-6 rounded-2xl hover:bg-cyan-500/10"><h3 class="text-xl font-bold">Mathematics</h3></button>
            <button onclick="showSubjects('CS')" class="glass p-6 rounded-2xl hover:bg-cyan-500/10"><h3 class="text-xl font-bold">Computer Science</h3></button>
        </div>
        <button onclick="showGame()" class="glass p-6 rounded-2xl hover:bg-purple-500/10 w-full mt-4"><h3 class="text-xl font-bold">MCQ Game - 15 Levels</h3></button>
        <button onclick="showAIBot()" class="glass p-6 rounded-2xl hover:bg-green-500/10 w-full mt-4"><h3 class="text-xl font-bold">AI Bot</h3></button>
    </div>

    <div id="chapterMenu" class="hidden glass p-6 rounded-2xl"></div>
    <div id="topicMenu" class="hidden glass p-6 rounded-2xl"></div>
    <div id="quizBox" class="hidden glass p-6 rounded-2xl">
        <h3 id="quizTitle" class="text-xl font-bold mb-2"></h3>
        <p id="formulaBox" class="text-xs bg-slate-800 p-2 rounded mb-4 text-cyan-300"></p>
        <p id="qText" class="text-lg mb-4"></p>
        <div id="options"></div>
        <div class="flex justify-between mt-4">
            <button onclick="prevQ()" class="btn bg-slate-700">Prev</button>
            <span id="qCount" class="font-mono"></span>
            <button onclick="nextQ()" class="btn btn-primary">Next</button>
        </div>
        <button onclick="submitQuiz()" class="btn btn-primary w-full mt-4">Submit Test</button>
    </div>
    <div id="resultBox" class="hidden glass p-6 rounded-2xl text-center"></div>
    <div id="gameBox" class="hidden glass p-6 rounded-2xl">
        <h3 class="text-xl font-bold mb-2">Level <span id="levelNum">1</span> / 15</h3>
        <p id="gameQ" class="text-lg mb-4"></p>
        <div id="gameOptions"></div>
        <button onclick="showHint()" class="btn bg-amber-600 mt-2">💡 Hint</button>
        <p id="hintText" class="text-sm text-amber-300 mt-2 hidden"></p>
    </div>
    <div id="aiBot" class="hidden glass p-6 rounded-2xl">
        <h3 class="text-xl font-bold mb-4">AI Study Bot</h3>
        <div id="chatLog" class="h-64 overflow-y-auto bg-slate-900 p-3 rounded mb-4"></div>
        <input id="chatInput" class="w-full p-2 rounded bg-slate-800" placeholder="Ask: What is a Set">
        <button onclick="askBot()" class="btn btn-primary mt-2 w-full">Ask</button>
    </div>
</div>

let currentSubject="", currentClass="", currentChapter="", currentTopic="", currentQs=[], qIndex=0, score=0, answers=[], gameLevel=1, gameQs=[];

function showHome(){
    ['home','chapterMenu','topicMenu','quizBox','resultBox','gameBox','aiBot'].forEach(id=>document.getElementById(id).classList.add('hidden'));
    document.getElementById('home').classList.remove('hidden');
}

function showSubjects(sub){
    currentSubject = sub;
    let menu = document.getElementById('chapterMenu');
    menu.innerHTML = `<h2 class="text-2xl font-bold mb-4">${DATA[sub].name} - Select Class</h2>
    <button onclick="showChapters('${sub}','11th')" class="btn btn-primary w-full mb-2">11th Class</button>
    <button onclick="showChapters('${sub}','12th')" class="btn btn-primary w-full">12th Class</button>`;
    showHome(); document.getElementById('chapterMenu').classList.remove('hidden');
}

function showChapters(sub, cls){
    currentClass = cls;
    let menu = document.getElementById('chapterMenu');
    menu.innerHTML = `<h2 class="text-2xl font-bold mb-4">${DATA[sub].name} ${cls}</h2>`;
    for(let key in DATA[sub][cls]){
        let ch = DATA[sub][cls][key];
        menu.innerHTML += `<div class="glass p-4 rounded-xl mb-3">
            <h4 class="font-bold text-cyan-400">${ch.name}</h4>
            <button onclick="showTopics('${sub}','${cls}','${key}')" class="btn btn-primary mt-2 mr-2">Open Topics</button>
            <button onclick="startFullTest('${sub}','${cls}','${key}')" class="btn bg-slate-700 mt-2">Full Chapter Test 20</button>
        </div>`;
    }
}

function showTopics(sub, cls, ch){
    currentChapter = ch;
    let menu = document.getElementById('topicMenu');
    menu.innerHTML = `<h2 class="text-2xl font-bold mb-4">${DATA[sub][cls][ch].name} - Select Topic</h2>`;
    for(let topic in DATA[sub][cls][ch].topics){
        menu.innerHTML += `<button onclick="startTopicTest('${sub}','${cls}','${ch}','${topic}')" class="btn bg-slate-700 w-full mb-2">${topic} - 15 MCQs</button>`;
    }
    showHome(); document.getElementById('topicMenu').classList.remove('hidden');
}

function startTopicTest(sub, cls, ch, topic){
    currentTopic = topic;
    currentQs = DATA[sub][cls][ch].topics[topic];
    qIndex=0; score=0; answers=[];
    document.getElementById('quizTitle').innerText = topic + " - 15 MCQs";
    document.getElementById('formulaBox').innerText = "Formula: " + DATA[sub][cls][ch].formula;
    showQuestion();
    showHome(); document.getElementById('quizBox').classList.remove('hidden');
}

function startFullTest(sub, cls, ch){
    let all=[];
    for(let t in DATA[sub][cls][ch].topics) all = all.concat(DATA[sub][cls][ch].topics[t]);
    currentQs = all.sort(()=>0.5-Math.random()).slice(0,20);
    qIndex=0; score=0; answers=[];
    document.getElementById('quizTitle').innerText = DATA[sub][cls][ch].name + " - Full Test 20";
    document.getElementById('formulaBox').innerText = "Formula: " + DATA[sub][cls][ch].formula;
    showQuestion();
    showHome(); document.getElementById('quizBox').classList.remove('hidden');
}

function showQuestion(){
    let q = currentQs[qIndex];
    document.getElementById('qText').innerText = q.q;
    document.getElementById('qCount').innerText = `${qIndex+1}/${currentQs.length}`;
    let opts = '';
    q.opts.forEach((opt,i)=> opts += `<button class="btn-option" onclick="selectAns(${i}, this)">${opt}</button>`);
    document.getElementById('options').innerHTML = opts;
}
function selectAns(i, el){
    answers[qIndex]=i;
    document.querySelectorAll('.btn-option').forEach(b=>b.disabled=true);
    if(i==currentQs[qIndex].ans) el.classList.add('correct'); else el.classList.add('wrong');
}
function nextQ(){ if(qIndex<currentQs.length-1) {qIndex++; showQuestion();} }
function prevQ(){ if(qIndex>0) {qIndex--; showQuestion();} }
function submitQuiz(){
    score = answers.filter((a,i)=>a===currentQs[i].ans).length;
    let per = ((score/currentQs.length)*100).toFixed(1);
    document.getElementById('resultBox').innerHTML = `<h2 class="text-2xl font-bold">Score: ${score}/${currentQs.length}</h2><p>${per}%</p>`;
    showHome(); document.getElementById('resultBox').classList.remove('hidden');
}

// GAME 15 LEVELS
function showGame(){
    gameLevel=1;
    gameQs = DATA.Physics["11th"].CH1.topics["Physical Quantities"].concat(
        DATA.Maths["11th"].CH1.topics["Sets"],
        DATA.CS["11th"].CH1.topics["Hardware"]
    ).slice(0,15);
    loadGameLevel();
    showHome(); document.getElementById('gameBox').classList.remove('hidden');
}
function loadGameLevel(){
    document.getElementById('levelNum').innerText = gameLevel;
    let q = gameQs[gameLevel-1];
    document.getElementById('gameQ').innerText = q.q;
    document.getElementById('hintText').innerText = "Hint: Read the question carefully";
    document.getElementById('hintText').classList.add('hidden');
    let opts='';
    q.opts.forEach((opt,i)=> opts+=`<button class="btn-option" onclick="checkGame(${i},${q.ans})">${opt}</button>`);
    document.getElementById('gameOptions').innerHTML=opts;
}
function checkGame(i,ans){
    if(i==ans && gameLevel<15) gameLevel++;
    loadGameLevel();
}
function showHint(){ document.getElementById('hintText').classList.remove('hidden'); }

// AI BOT
function showAIBot(){ showHome(); document.getElementById('aiBot').classList.remove('hidden'); }
function askBot(){
    let input = document.getElementById('chatInput').value.toLowerCase();
    document.getElementById('chatLog').innerHTML += `<div class="text-right mb-1">You: ${input}</div>`;
    let reply = "I can help with Physics, Maths and CS. Ask about any formula or concept.";
    if(input.includes("force")) reply = "Formula: F = ma";
    if(input.includes("set")) reply = "Formula: n(A∪B) = n(A)+n(B)-n(A∩B)";
    if(input.includes("byte")) reply = "Formula: 1 Byte = 8 Bits";
    document.getElementById('chatLog').innerHTML += `<div class="text-left text-cyan-400 mb-1">Bot: ${reply}</div>`;
    document.getElementById('chatInput').value='';
}
</script>
