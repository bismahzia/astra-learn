<style>
 body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: 'Segoe UI', sans-serif; }
.glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.2); }
.btn { padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.btn-primary { background: linear-gradient(90deg, #0ea5e9, #0284c7); color: white; }
.btn-primary:hover { transform: scale(1.05); }
.btn-subject { width: 100%; padding: 1.2rem; border-radius: 1rem; background: rgba(51, 65, 85, 0.6); text-align: center; font-size: 1.1rem; }
.btn-subject:hover { background: linear-gradient(90deg, #0ea5e9, #06b6d4); transform: translateY(-3px); }
.btn-option { width: 100%; text-align: left; padding: 1rem; margin: 0.5rem 0; border-radius: 0.75rem; background: #334155; border: 2px solid transparent; }
.btn-option:hover { background: #475569; border-color: #0ea5e9; }
.correct { background: rgba(34,197,94,0.3)!important; border: 2px solid #22c55e!important; }
.wrong { background: rgba(239,68,68,0.3)!important; border: 2px solid #ef4444!important; }
.hidden { display: none; }
</style>

// ===== JS FUNCTIONS =====
let currentSubject="", currentChapter="", currentQ=0, score=0, gameLevel=0;

function showHome(){
 ['home','chapterMenu','quizBox','gameBox','aiBot'].forEach(id=>document.getElementById(id).classList.add('hidden'));
 document.getElementById('home').classList.remove('hidden');
}

function showSubjects(sub){
 currentSubject = sub;
 let menu = document.getElementById('chapterMenu');
 menu.innerHTML = `<h2 class="text-2xl font-bold mb-4">${QUIZ_DATA[sub].name} - Select Chapter</h2><div class="grid md:grid-cols-2 gap-4">`;
 for(let ch in QUIZ_DATA[sub]){
  if(ch.startsWith("CH")){
   menu.innerHTML += `<button onclick="startQuiz('${sub}','${ch}')" class="btn-subject">
   <h3 class="font-bold text-lg">${QUIZ_DATA[sub][ch].name}</h3>
   <p class="text-sm text-cyan-300">Formula: ${QUIZ_DATA[sub][ch].formula}</p>
   <p class="text-xs mt-2">15 MCQs</p>
   </button>`;
  }
 menu.innerHTML += `</div>`;
 showDiv('chapterMenu');
}

function startQuiz(sub, ch){
 currentSubject=sub; currentChapter=ch; currentQ=0; score=0;
 showDiv('quizBox'); loadQuestion();
}

function loadQuestion(){
 let qData = QUIZ_DATA[currentSubject][currentChapter].topics.MCQs[currentQ];
 document.getElementById('quizBox').innerHTML = `
  <div class="glass p-6 rounded-2xl">
   <h3 class="text-xl mb-2">${QUIZ_DATA[currentSubject][currentChapter].name}</h3>
   <p class="text-sm text-cyan-300 mb-4">Formula: ${QUIZ_DATA[currentSubject][currentChapter].formula}</p>
   <h4 class="text-lg mb-4">${qData.q}</h4>
   ${qData.opts.map((opt,i)=>`<button onclick="checkAns(${i})" class="btn-option" id="opt${i}">${i+1}. ${opt}</button>`).join('')}
   <p class="mt-4">Question ${currentQ+1} / 15 | Score: ${score}</p>
  </div>
 `;
}

function checkAns(i){
 let qData = QUIZ_DATA[currentSubject][currentChapter].topics.MCQs[currentQ];
 let buttons = document.querySelectorAll('.btn-option');
 buttons.forEach(btn => btn.disabled = true);

 if(i==qData.ans){
  score++;
  buttons[i].classList.add('correct');
 } else {
  buttons[i].classList.add('wrong');
  buttons[qData.ans].classList.add('correct');
 }

 setTimeout(()=>{
  currentQ++;
  if(currentQ < 15) loadQuestion();
  else showResult();
 }, 1000);
}

function showResult(){
 document.getElementById('quizBox').innerHTML = `
  <div class="glass p-6 rounded-2xl text-center">
   <h2 class="text-2xl font-bold mb-4">Quiz Complete!</h2>
   <p class="text-4xl mb-2">${score}/15</p>
   <p class="text-slate-400 mb-4">${score >= 12? 'Excellent!' : score >= 8? 'Good Job!' : 'Keep Practicing!'}</p>
   <button onclick="showSubjects('${currentSubject}')" class="btn btn-primary">Back to Chapters</button>
  </div>
 `;
}

function showGame(){
 gameLevel = 0;
 showDiv('gameBox'); loadGameLevel();
}

function loadGameLevel(){
 let qData = QUIZ_DATA.GAME.levels[gameLevel];
 document.getElementById('gameBox').innerHTML = `
  <div class="glass p-6 rounded-2xl">
   <h3 class="text-2xl mb-4 text-green-400">${qData.q}</h3>
   ${qData.opts.map((opt,i)=>`<button onclick="checkGame(${i})" class="btn-option" id="gopt${i}">${i+1}. ${opt}</button>`).join('')}
   <p class="mt-4">Level ${gameLevel+1} / 15</p>
  </div>
 `;
}

function checkGame(i){
 let qData = QUIZ_DATA.GAME.levels[gameLevel];
 let buttons = document.querySelectorAll('#gameBox.btn-option');
 buttons.forEach(btn => btn.disabled = true);

 if(i==qData.ans){
  buttons[i].classList.add('correct');
  setTimeout(()=>{
   gameLevel++;
   if(gameLevel < 15) loadGameLevel();
   else document.getElementById('gameBox').innerHTML = '<div class="glass p-6 text-center"><h2 class="text-3xl">🎉 You Won All 15 Levels!</h2><button onclick="showHome()" class="btn btn-primary mt-4">Home</button></div>';
  }, 1000);
 } else {
  buttons[i].classList.add('wrong');
  setTimeout(()=>{ loadGameLevel(); }, 1000);
 }
}

function showAiBot(){
 showDiv('aiBot');
 document.getElementById('aiBot').innerHTML = `
  <div class="glass p-6 rounded-2xl">
   <h2 class="text-2xl mb-4">🤖 AI Bot</h2>
   <div id="chatBox" class="h-64 overflow-y-auto mb-4 p-4 bg-slate-800 rounded-lg"></div>
   <input type="text" id="userInput" placeholder="Type: hello, physics, maths, cs, game" class="w-full p-3 rounded-lg bg-slate-700 mb-2 text-white">
   <button onclick="sendMsg()" class="btn btn-primary w-full">Send</button>
  </div>
 `;
}

function sendMsg(){
 let input = document.getElementById('userInput').value.toLowerCase();
 let chatBox = document.getElementById('chatBox');
 chatBox.innerHTML += `<p class="text-right mb-2">You: ${input}</p>`;
 let reply = QUIZ_DATA.AI_BOT.responses[input] || QUIZ_DATA.AI_BOT.responses.default;
 chatBox.innerHTML += `<p class="text-left mb-2 text-cyan-300">Bot: ${reply}</p>`;
 document.getElementById('userInput').value = '';
 chatBox.scrollTop = chatBox.scrollHeight;
}

function showDiv(id){
 ['home','chapterMenu','quizBox','gameBox','aiBot'].forEach(d=>document.getElementById(d).classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
}
</script>
