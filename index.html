let currentLevel = 0;
function startGame(){
  document.getElementById('home').style.display='none';
  document.getElementById('gameBox').style.display='block';
  showLevel();
}
function showLevel(){
  let l = gameLevels[currentLevel];
  document.getElementById('gameBox').innerHTML = `
  <h3>🧩 Level ${currentLevel+1} / 20</h3>
  <p><b>Buggy Code:</b> <code>${l.bug}</code></p>
  <input id="gameAns" placeholder="Fix karo yahan" style="width:100%;padding:10px;background:#0B1120;color:#fff;border:1px solid #374151;border-radius:8px;">
  <button class="btn" onclick="checkGame()">Submit</button>
  <button class="btn-small" onclick="alert('Hint: ${l.hint}')">💡 Hint</button>
  <button class="btn-secondary" onclick="location.reload()">Home</button>
  `;
}
function checkGame(){
  let ans = document.getElementById('gameAns').value.trim();
  if(ans === gameLevels[currentLevel].fix){
    currentLevel++;
    if(currentLevel >= 20) {alert("🎉 Game Complete!"); location.reload();}
    else {alert("Correct! Next Level"); showLevel();}
  } else {alert("Galat! Hint use karo 💡");}
}

function loadSubject(sub){
  document.getElementById('home').style.display='none';
  let div = document.createElement('div'); div.className='grid'; div.id=sub+'Div';
  for(let key in D){ if(key.startsWith(sub)){
    let ch = D[key];
    let html = `<div class="card"><h3>${ch.name}</h3>`;
    ch.topics.forEach((t,i)=>{
      html += `<div class="topic"><h4>${t.t}</h4><p>${t.s}</p><button class="btn btn-small" onclick="startQuiz('${key}-t${i}')">📝 Topic Test: 20 MCQs</button></div>`;
    });
    html += `<button class="btn" onclick="startQuiz('${key}')">📝 Full Chapter Test: 30 MCQs</button>`;
    html += `<button class="btn btn-ai" onclick="openAI('${ch.name}')">🤖 AI Tutor</button>`;
    html += `<button class="btn-secondary" onclick="location.reload()">Back Home</button></div>`;
    div.innerHTML += html;
  }}
  document.body.appendChild(div);
}

let quizData=[], qIndex=0, score=0;
function startQuiz(key){
  document.getElementById('home').style.display='none';
  document.querySelectorAll('.grid').forEach(g=>g.style.display='none');
  quizData = key.includes('-t')? D[key.split('-t')[0]].topics[key.split('-t')[1]].test : D[key].test;
  qIndex=0; score=0; document.getElementById('quizBox').style.display='block'; showQ();
}
function showQ(){
  let q = quizData[qIndex];
  document.getElementById('quizBox').innerHTML = `
  <h3>Q${qIndex+1}/${quizData.length}</h3><p>${q.q}</p>
  ${q.o.map((op,i)=>`<button class="btn" style="background:#374151" onclick="checkAns('${op}')">${op}</button>`).join('')}
  <p>Score: ${score}</p>`;
}
function checkAns(ans){
  if(ans === quizData[qIndex].a) score++;
  qIndex++;
  if(qIndex < quizData.length) showQ();
  else {alert(`Test khatam! Score: ${score}/${quizData.length}`); location.reload();}
}

function openAI(chName){
  let id = 'ai'+chName.replace(/ /g,'');
  let box = document.getElementById(id);
  if(!box){
    box = document.createElement('div'); box.id=id; box.className='ai-box';
    box.innerHTML = `<input id="aiInput${id}" class="ai-input" placeholder="Is chapter se kya poochna hai?"><button class="btn" style="width:30%" onclick="askAI('${chName}','${id}')">Send</button><div id="aiOut${id}"></div>`;
    event.target.parentElement.appendChild(box);
  }
  box.style.display = box.style.display==='none'?'block':'none';
}
function askAI(chName,id){
  let q = document.getElementById('aiInput'+id).value;
  document.getElementById('aiOut'+id).innerHTML = `<p><b>Astra AI:</b> "${q}" - Ye ${chName} ka important topic hai. Formula yaad rakho aur MCQ practice karo. Koi specific sawal poocho.</p>`;
}
