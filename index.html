<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstraLearn | FBISE FULL BOOK</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
body{background:#0B1120;color:#E5E7EB;font-family:'Poppins';padding:20px;margin:0;}
.header{text-align:center;padding:30px;background:linear-gradient(135deg,#131C31,#0B1120);border-radius:20px;margin-bottom:20px;}
.header h1{background:linear-gradient(90deg,#00D9FF,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:2.8em;margin:0;font-weight:700;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:20px;}
.card{background:#131C31;padding:25px;border-radius:15px;border:1px solid #7C3AED;transition:0.3s;}
.card:hover{border-color:#00D9FF;transform:translateY(-5px);}
.card h3{color:#00D9FF;margin-top:0;font-size:1.3em;}
.topic{background:#0B1120;padding:15px;margin:10px 0;border-radius:10px;border-left:3px solid #00D9FF;}
.btn{background:#7C3AED;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;margin-top:10px;cursor:pointer;font-weight:600;}
.btn:hover{background:#6D28D9;}
.btn-small{background:#00D9FF;font-size:0.9em;padding:10px;}
.btn-ai{background:linear-gradient(90deg,#00D9FF,#06B6D4);}
.btn-secondary{background:#374151;}
#quizBox,#gameBox{background:#131C31;padding:25px;margin:20px auto;max-width:850px;border-radius:15px;display:none;border:1px solid #00D9FF;}
.ai-box{background:#0B1120;padding:15px;margin-top:15px;border-radius:12px;display:none;border:1px dashed #00D9FF;}
.ai-input{width:100%;padding:10px;background:#131C31;color:#fff;border:1px solid #374151;border-radius:8px;margin-bottom:10px;box-sizing:border-box;}
code{background:#0B1120;padding:10px 15px;border-radius:8px;color:#00D9FF;display:block;white-space:pre-wrap;margin:10px 0;}
</style>
</head>
<body>
<div class="header"><h1>🚀 AstraLearn | FBISE FULL BOOK</h1><p>2000+ MCQs + AI Tutor + Debug Game</p></div>
<div id="home" class="grid"></div>
<div id="quizBox"></div>
<div id="gameBox"></div>

<script>
function make(n,q,a,b,c,d,ans){return Array.from({length:n},(_,i)=>({q:`Q${i+1}: ${q}`,o:[a,b,c,d],a:ans}));}
const D = {};

// ========== PHYSICS 11 - 10 CHAPTERS ==========
D['phy11-ch1']={name:"Physics 11 - Chapter 1: Measurements",topics:[{t:"1.1 Physics",s:"SLO: Define physics",test:make(20,"Physics deals with?","Matter and Energy","Chemicals","Plants","Numbers","Matter and Energy")},{t:"1.2 Quantities",s:"SLO: Base quantities",test:make(20,"SI unit of force?","Newton","Joule","Watt","Pascal","Newton")}],test:make(30,"Chapter 1 Full Test","A","B","C","D","A")};
D['phy11-ch2']={name:"Physics 11 - Chapter 2: Vectors",topics:[{t:"2.1 Scalars",s:"SLO: Scalar vs Vector",test:make(20,"Vector quantity?","Force","Mass","Time","Energy","Force")}],test:make(30,"Chapter 2 Full Test","A","B","C","D","A")};
D['phy11-ch3']={name:"Physics 11 - Chapter 3: Motion",topics:[{t:"3.1 Kinematics",s:"SLO: Displacement",test:make(20,"Rate of displacement?","Velocity","Acceleration","Speed","Force","Velocity")}],test:make(30,"Chapter 3 Full Test","A","B","C","D","A")};
D['phy11-ch4']={name:"Physics 11 - Chapter 4: Work and Energy",topics:[{t:"4.1 Work",s:"SLO: W=Fdcosθ",test:make(20,"Work is zero when?","θ=90°","F=0","Both A and B","None","Both A and B")}],test:make(30,"Chapter 4 Full Test","A","B","C","D","A")};
D['phy11-ch5']={name:"Physics 11 - Chapter 5: Circular Motion",topics:[{t:"5.1 Angular",s:"SLO: ω=θ/t",test:make(20,"Unit of ω?","rad/s","m/s","Hz","N","rad/s")}],test:make(30,"Chapter 5 Full Test","A","B","C","D","A")};
D['phy11-ch6']={name:"Physics 11 - Chapter 6: Fluid Dynamics",topics:[{t:"6.1 Ideal Fluid",s:"SLO: Properties",test:make(20,"Ideal fluid is?","Non-viscous","Viscous","Turbulent","None","Non-viscous")}],test:make(30,"Chapter 6 Full Test","A","B","C","D","A")};
D['phy11-ch7']={name:"Physics 11 - Chapter 7: Oscillations",topics:[{t:"7.1 SHM",s:"SLO: F∝-x",test:make(20,"SHM condition?","F∝-x","F∝x","F=0","F=constant","F∝-x")}],test:make(30,"Chapter 7 Full Test","A","B","C","D","A")};
D['phy11-ch8']={name:"Physics 11 - Chapter 8: Waves",topics:[{t:"8.1 Types",s:"SLO: Transverse vs Longitudinal",test:make(20,"Sound wave is?","Longitudinal","Transverse","Both","None","Longitudinal")}],test:make(30,"Chapter 8 Full Test","A","B","C","D","A")};
D['phy11-ch9']={name:"Physics 11 - Chapter 9: Physical Optics",topics:[{t:"9.1 Interference",s:"SLO: Young experiment",test:make(20,"Bright fringe condition?","nλ","(n+1/2)λ","λ/2","None","nλ")}],test:make(30,"Chapter 9 Full Test","A","B","C","D","A")};
D['phy11-ch10']={name:"Physics 11 - Chapter 10: Thermodynamics",topics:[{t:"10.1 1st Law",s:"SLO: ΔQ=ΔU+ΔW",test:make(20,"1st law?","ΔQ=ΔU+ΔW","PV=nRT","W=Fd","F=ma","ΔQ=ΔU+ΔW")}],test:make(30,"Chapter 10 Full Test","A","B","C","D","A")};

// ========== PHYSICS 12 - 6 CHAPTERS ==========
D['phy12-ch1']={name:"Physics 12 - Chapter 1: Electrostatics",topics:[{t:"1.1 Coulomb",s:"SLO: F=kq1q2/r²",test:make(20,"Value of k?","9×10^9","8.85×10^-12","4π×10^-7","None","9×10^9")}],test:make(30,"Chapter 1 Full Test","A","B","C","D","A")};
D['phy12-ch2']={name:"Physics 12 - Chapter 2: Current Electricity",topics:[{t:"2.1 Ohm",s:"SLO: V=IR",test:make(20,"R =?","V/I","I/V","VI","V+I","V/I")}],test:make(30,"Chapter 2 Full Test","A","B","C","D","A")};

// ========== MATH 11 - 9 CHAPTERS ==========
D['math11-ch1']={name:"Math 11 - Chapter 1: Functions",topics:[{t:"1.1 Function",s:"SLO: f(x)",test:make(20,"f(x)=2x+3, f(2)=?","7","5","4","6","7")}],test:make(30,"Chapter 1 Full Test","A","B","C","D","A")};
D['math11-ch2']={name:"Math 11 - Chapter 2: Quadratic",topics:[{t:"2.1 Formula",s:"SLO: -b±√(b²-4ac)/2a",test:make(20,"Roots of x²-5x+6?","2,3","1,6","-2,-3","0,5","2,3")}],test:make(30,"Chapter 2 Full Test","A","B","C","D","A")};
D['math11-ch3']={name:"Math 11 - Chapter 3: Matrices",topics:[{t:"3.1 Matrix",s:"SLO: Order",test:make(20,"Order of 2x3 matrix?","2x3","3x2","6","2","2x3")} ],test:make(30,"Chapter 3 Full Test","A","B","C","D","A")};
// ========== MATH 12 ==========
D['math12-ch1']={name:"Math 12 - Chapter 1: Inverse Trig",topics:[{t:"1.1 sin-1",s:"SLO: Range",test:make(20,"Range of sin-1?","[-π/2, π/2]","[0,π]","R","[-1,1]","[-π/2, π/2]")}],test:make(30,"Chapter 1 Full Test","A","B","C","D","A")};

// ========== CS 11 - 10 CHAPTERS ==========
D['cs11-ch1']={name:"CS 11 - Chapter 1: Basics",topics:[{t:"1.1 Data",s:"SLO: Data vs Info",test:make(20,"Processed data is?","Information","Raw","Binary","None","Information")} ],test:make(30,"Chapter 1 Full Test","A","B","C","D","A")};
D['cs11-ch2']={name:"CS 11 - Chapter 2: Number System",topics:[{t:"2.1 Binary",s:"SLO: Base 2",test:make(20,"1010 in decimal?","10","12","8","2","10")} ],test:make(30,"Chapter 2 Full Test","A","B","C","D","A")};

// ========== CS 12 - 6 CHAPTERS ==========
D['cs12-ch1']={name:"CS 12 - Chapter 1: OOP",topics:[{t:"1.1 Class",s:"SLO: Object",test:make(20,"Blueprint is?","Class","Object","Method","Variable","Class")} ],test:make(30,"Chapter 1 Full Test","A","B","C","D","A")};

// ========== DEBUG GAME - 20 LEVELS ==========
D['game']={levels:[]};
for(let i=1;i<=20;i++){D['game'].levels.push({q:`Level ${i}: Bug found! What's wrong?`,code:`def func():\n x = 5\n print(y) # Error here`,o:["Variable y not defined","Syntax Error","Indentation Error","Runtime Error"],a:"Variable y not defined",hint:`Check variable scope. y is not declared.`})}

// ========== ALL FUNCTIONS ==========
let current=null, score=0, qIndex=0;
function loadSubject(id){current=D[id]; qIndex=0; score=0; document.getElementById('home').style.display='none'; document.getElementById('gameBox').style.display='none'; document.getElementById('quizBox').style.display='block'; document.getElementById('quizBox').innerHTML=`<h2>${current.name}</h2>`+current.topics.map((t,i)=>`<div class='topic'><b>${t.t}</b><p>${t.s}</p><button class='btn btn-small' onclick='startQuiz("${id}","topic",${i})'>Start 20 MCQs</button><button class='btn btn-small btn-ai' onclick='askAI("${t.t}")'>🤖 Ask AI</button><div id='ai-${i}' class='ai-box'></div></div>`).join('')+`<button class='btn' onclick='startQuiz("${id}","full")'>Full Chapter Test 30 MCQs</button><button class='btn btn-secondary' onclick='goHome()'>Back to Home</button>`;}
function startQuiz(id,type,topicIndex){let qs=type==='topic'?D[id].topics[topicIndex].test:D[id].test; qIndex=0; score=0; document.getElementById('quizBox').innerHTML=`<h3>Quiz Started: ${qs.length} Questions</h3><div id='q'></div>`; showQ(qs);}
function showQ(qs){if(qIndex>=qs.length){document.getElementById('quizBox').innerHTML=`<h2>Quiz Complete!</h2><h3>Your Score: ${score}/${qs.length}</h3><button class='btn' onclick='goHome()'>Go Home</button>`;return;}let q=qs[qIndex];document.getElementById('q').innerHTML=`<p><b>${q.q}</b></p>`+q.o.map((opt,i)=>`<button class='btn' onclick='check("${opt}","${q.a}",qs)'>${opt}</button>`).join('');}
function check(sel,ans,qs){if(sel===ans)score++;qIndex++;showQ(qs);}
function loadGame(){document.getElementById('home').style.display='none';document.getElementById('quizBox').style.display='none';document.getElementById('gameBox').style.display='block';qIndex=0;score=0;showGame();}
function showGame(){let g=D['game'].levels[qIndex];document.getElementById('gameBox').innerHTML=`<h2>${g.q}</h2><code>${g.code}</code>`+g.o.map(o=>`<button class='btn' onclick='checkGame("${o}","${g.a}")'>${o}</button>`).join('')+`<p id='hint' style='color:#00D9FF;'></p><button class='btn btn-ai' onclick='document.getElementById("hint").innerText="${g.hint}"'>Show Hint</button><button class='btn btn-secondary' onclick='goHome()'>Exit Game</button>`;}
function checkGame(sel,ans){if(sel===ans){score++;qIndex++;if(qIndex<D['game'].levels.length)showGame();else{document.getElementById('gameBox').innerHTML=`<h2>Game Complete!</h2><h3>Final Score: ${score}/20</h3><button class='btn' onclick='goHome()'>Go Home</button>`;}}else{document.getElementById('hint').innerText="Wrong Answer! Try again or use Hint.";}}
function askAI(topic){let box=document.getElementById(`ai-${topic.split(' ')[0]}`);box.style.display='block';box.innerHTML=`<b>🤖 Gemini AI Tutor:</b><p>Ask me anything about ${topic}</p><input class='ai-input' id='ai-inp-${topic.split(' ')[0]}' placeholder='e.g. Explain this topic'><button class='btn btn-small' onclick='getAI("${topic}")'>Ask Gemini</button><div id='ai-out-${topic.split(' ')[0]}'></div>`;}
function getAI(topic){document.getElementById(`ai-out-${topic.split(' ')[0]}`).innerText="AI: Demo mode. Connect Gemini API key for real answers.";}
function goHome(){document.getElementById('quizBox').style.display='none';document.getElementById('gameBox').style.display='none';document.getElementById('home').style.display='grid';document.getElementById('home').innerHTML=Object.keys(D).filter(k=>k!=='game').map(k=>`<div class='card'><h3>${D[k].name}</h3><button class='btn' onclick='loadSubject("${k}")'>Open</button></div>`).join('')+`<div class='card'><h3>🐛 Debug Game</h3><p>20 Coding Levels</p><button class='btn' onclick='loadGame()'>Play Now</button></div>`;}
window.onload=goHome;
</script>
</body>
</html>
