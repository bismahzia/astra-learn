<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra Learn - PHY 11 Part 1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: 'Segoe UI', sans-serif; }
  .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
  .btn { padding: 0.5rem 1rem; border-radius: 0.75rem; font-weight: 600; transition: all 0.2s; cursor: pointer; }
  .btn-primary { background: #06b6d4; color: white; }
  .btn-primary:hover { background: #0891b2; }
  .btn-option { width: 100%; text-align: left; padding: 0.75rem; margin: 0.5rem 0; border-radius: 0.5rem; background: #334155; border: 1px solid #475569; }
  .btn-option:hover { background: #475569; }
  .correct { background: rgba(34,197,94,0.3)!important; border-color: #22c55e!important; }
  .wrong { background: rgba(239,68,68,0.3)!important; border-color: #ef4444!important; }
  .hidden { display: none; }
</style>
</head>
<body class="text-slate-100 min-h-screen">

<div class="max-w-6xl mx-auto p-4">
    <header class="glass p-4 rounded-2xl mb-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-cyan-400">Astra Learn 🚀 PHY 11 Part 1</h1>
        <button onclick="showHome()" class="btn btn-primary">Home</button>
    </header>

    <div id="home">
        <div class="glass p-6 rounded-2xl mb-4 text-center">
            <h2 class="text-3xl font-bold mb-2">Physics 11th - Part 1</h2>
            <p class="text-slate-400">CH1 to CH3 | 15 MCQs per Topic + 20 MCQs Full Chapter Test</p>
        </div>
        <div id="chapterList" class="grid md:grid-cols-3 gap-4"></div>

        <button onclick="showGame()" class="glass p-6 rounded-2xl hover:bg-purple-500/10 w-full mt-4"><h3 class="text-xl font-bold">MCQ Game - 15 Levels</h3></button>
        <button onclick="showAIBot()" class="glass p-6 rounded-2xl hover:bg-green-500/10 w-full mt-4"><h3 class="text-xl font-bold">AI Bot</h3></button>
    </div>

    <div id="quizBox" class="hidden glass p-6 rounded-2xl">
        <h3 id="quizTitle" class="text-xl font-bold mb-2"></h3>
        <p id="formulaBox" class="text-xs bg-slate-800 p-2 rounded mb-4 text-cyan-300"></p>
        <p id="qText" class="text-lg mb-4"></p>
        <div id="options"></div>
        <div class="flex justify-between mt-4">
            <button onclick="prevQ()" class="btn bg-slate-700">Prev</button>
            <span id="qCount" class="font-mono"></span>
            <button onclick="nextQ()" class="btn btn-primary">Next</button>
        </div>
        <button onclick="submitQuiz()" class="btn btn-primary w-full mt-4">Submit Test</button>
    </div>
    <div id="resultBox" class="hidden glass p-6 rounded-2xl text-center"></div>

    <div id="gameBox" class="hidden glass p-6 rounded-2xl">
        <h3 class="text-xl font-bold mb-2">Level <span id="levelNum">1</span> / 15</h3>
        <p id="gameQ" class="text-lg mb-4"></p>
        <div id="gameOptions"></div>
        <button onclick="showHint()" class="btn bg-amber-600 mt-2">💡 Hint</button>
        <p id="hintText" class="text-sm text-amber-300 mt-2 hidden"></p>
    </div>

    <div id="aiBot" class="hidden glass p-6 rounded-2xl">
        <h3 class="text-xl font-bold mb-4">AI Study Bot</h3>
        <div id="chatLog" class="h-64 overflow-y-auto bg-slate-900 p-3 rounded mb-4"></div>
        <input id="chatInput" class="w-full p-2 rounded bg-slate-800" placeholder="Ask: Define Newton's Law">
        <button onclick="askBot()" class="btn btn-primary mt-2 w-full">Ask</button>
    </div>
</div>

<script>
const DATA = {
    PHY11: {
        name: "Physics 11th",
        chapters: {
            CH1: {
                name: "Chapter 1: Measurements",
                formula: "Relative Error = ΔA / A | %Error = (ΔA/A)*100% | Dimension of Velocity = [LT-1]",
                topics: ["Physical Quantities", "SI Units", "Errors", "Significant Figures"],
                mcqs: [
                    {q: "Q1: SI unit of force is:", opts: ["Joule", "Watt", "Newton", "Pascal"], ans: 2},
                    {q: "Q2: Which is a base quantity?", opts: ["Velocity", "Force", "Mass", "Energy"], ans: 2},
                    {q: "Q3: 1 light year is a unit of:", opts: ["Time", "Distance", "Speed", "Mass"], ans: 1},
                    {q: "Q4: Precision means:", opts: ["Closeness to true value", "Reproducibility", "Least count", "Zero error"], ans: 1},
                    {q: "Q5: Dimensional formula of velocity:", opts: ["[LT-1]", "[L2T-2]", "[MT-1]", "[L]"], ans: 0},
                    {q: "Q6: Significant figures in 0.00500:", opts: ["2", "3", "4", "5"], ans: 1},
                    {q: "Q7: Random errors can be reduced by:", opts: ["Calibration", "Taking average", "Zero correction", "Better instrument"], ans: 1},
                    {q: "Q8: Unit of G is:", opts: ["Nm2kg-2", "Nmkg-2", "N2mkg-1", "kgm/s2"], ans: 0},
                    {q: "Q9: Which is dimensionless?", opts: ["Angle", "Velocity", "Force", "Pressure"], ans: 0},
                    {q: "Q10: Vernier calipers measure:", opts: ["Mass", "Time", "Small length", "Current"], ans: 2},
                    {q: "Q11: 1 micron =?", opts: ["10-3 m", "10-6 m", "10-9 m", "10-12 m"], ans: 1},
                    {q: "Q12: Systematic error is due to:", opts: ["Instrument", "Observer", "Environment", "All"], ans: 3},
                    {q: "Q13: Dimension of momentum:", opts: ["[MLT-1]", "[MLT-2]", "[ML2T-1]", "[M2LT-1]"], ans: 0},
                    {q: "Q14: Least count of screw gauge:", opts: ["0.1 mm", "0.01 mm", "0.001 mm", "1 mm"], ans: 1},
                    {q: "Q15: Which is not a derived unit?", opts: ["Newton", "Joule", "Kelvin", "Watt"], ans: 2}
                ]
            },
            CH2: {
                name: "Chapter 2: Vectors and Equilibrium",
                formula: "R = √(A²+B²+2ABcosθ) | τ = r × F | Condition: ΣF=0, Στ=0",
                topics: ["Vector Addition", "Torque", "Equilibrium", "Center of Mass"],
                mcqs: [
                    {q: "Q1: Vector quantity is:", opts: ["Mass", "Time", "Force", "Energy"], ans: 2},
                    {q: "Q2: Resultant of 2 equal vectors at 60°:", opts: ["A", "A√2", "A√3", "2A"], ans: 2},
                    {q: "Q3: Dot product of perpendicular vectors:", opts: ["0", "1", "AB", "-AB"], ans: 0},
                    {q: "Q4: Torque is:", opts: ["Scalar", "Vector", "Tensor", "None"], ans: 1},
                    {q: "Q5: Condition for 1st equilibrium:", opts: ["ΣF=0", "Στ=0", "Both", "None"], ans: 2},
                    {q: "Q6: Cross product gives:", opts: ["Scalar", "Vector", "Number", "Angle"], ans: 1},
                    {q: "Q7: Unit of torque:", opts: ["N", "J", "Nm", "W"], ans: 2},
                    {q: "Q8: Null vector has:", opts: ["Zero magnitude", "No direction", "Both", "None"], ans: 2},
                    {q: "Q9: Head to tail rule is for:", opts: ["Dot product", "Vector addition", "Cross product", "Division"], ans: 1},
                    {q: "Q10: Couple produces:", opts: ["Translation", "Rotation", "Both", "None"], ans: 1},
                    {q: "Q11: Angle between i and j:", opts: ["0°", "45°", "90°", "180°"], ans: 2},
                    {q: "Q12: Scalar product is:", opts: ["Commutative", "Non-commutative", "Associative", "None"], ans: 0},
                    {q: "Q13: Center of gravity of ring:", opts: ["Center", "Edge", "Outside", "None"], ans: 0},
                    {q: "Q14: Moment arm is:", opts: ["r sinθ", "r cosθ", "r tanθ", "r"], ans: 0},
                    {q: "Q15: 2nd condition of equilibrium:", opts: ["ΣF=0", "Στ=0", "Σm=0", "Σv=0"], ans: 1}
                ]
            },
            CH3: {
                name: "Chapter 3: Motion and Force",
                formula: "v = u+at | s = ut+1/2at² | F = ma | Fc = mv²/r",
                topics: ["Kinematics", "Newton Laws", "Friction", "Circular Motion"],
                mcqs: [
                    {q: "Q1: 1st law is also called:", opts: ["Law of inertia", "Law of force", "Law of action", "None"], ans: 0},
                    {q: "Q2: Unit of momentum:", opts: ["Ns", "Nm", "J", "W"], ans: 0},
                    {q: "Q3: Acceleration is:", opts: ["Scalar", "Vector", "Both", "None"], ans: 1},
                    {q: "Q4: g value on earth:", opts: ["9.8 m/s2", "10 m/s2", "8.9 m/s2", "6.6 m/s2"], ans: 0},
                    {q: "Q5: Force required to stop body depends on:", opts: ["Mass", "Velocity", "Time", "All"], ans: 3},
                    {q: "Q6: Static friction is:", opts: ["< Kinetic", "> Kinetic", "= Kinetic", "Zero"], ans: 1},
                    {q: "Q7: Centripetal force:", opts: ["F=mv2/r", "F=mr2/v", "F=mv/r", "F=mr/v2"], ans: 0},
                    {q: "Q8: Rocket works on:", opts: ["1st law", "2nd law", "3rd law", "Gravitation"], ans: 2},
                    {q: "Q9: Area under v-t graph:", opts: ["Velocity", "Acceleration", "Displacement", "Force"], ans: 2},
                    {q: "Q10: Free fall acceleration:", opts: ["0", "g", "2g", "9.8"], ans: 1},
                    {q: "Q11: Inertia depends on:", opts: ["Mass", "Velocity", "Force", "Area"], ans: 0},
                    {q: "Q12: Action-reaction act on:", opts: ["Same body", "Different bodies", "Both", "None"], ans: 1},
                    {q: "Q13: Projectile path:", opts: ["Circle", "Ellipse", "Parabola", "Straight"], ans: 2},
                    {q: "Q14: Time of flight:", opts: ["2u/g", "u/g", "u/2g", "u2/g"], ans: 0},
                    {q: "Q15: Range is max at:", opts: ["30°", "45°", "60°", "90°"], ans: 1}
                ]
            }
        }
    }
};

let currentQs = [], qIndex = 0, score = 0, answers = [], gameLevel = 1, gameQs = [];

// Load chapters on home
window.onload = () => {
    let list = document.getElementById('chapterList');
    for(let key in DATA.PHY11.chapters){
        let ch = DATA.PHY11.chapters[key];
        list.innerHTML += `
        <div class="glass p-4 rounded-xl">
            <h4 class="font-bold text-cyan-400">${ch.name}</h4>
            <p class="text-xs text-slate-400 mb-2">Topics: ${ch.topics.join(', ')}</p>
            <button onclick="startQuiz('${key}',15)" class="btn bg-slate-700 mr-2 text-sm">Topic Test 15</button>
            <button onclick="startFullTest('${key}')" class="btn btn-primary text-sm">Full Test 20</button>
        </div>`;
    }
}

function showHome(){
    ['home','quizBox','resultBox','gameBox','aiBot'].forEach(id=>document.getElementById(id).classList.add('hidden'));
    document.getElementById('home').classList.remove('hidden');
}

function startQuiz(ch, count){
    currentQs = [...DATA.PHY11.chapters[ch].mcqs].slice(0,count);
    qIndex=0; score=0; answers=[];
    document.getElementById('quizTitle').innerText = DATA.PHY11.chapters[ch].name + " - Topic Test";
    document.getElementById('formulaBox').innerText = "Formula: " + DATA.PHY11.chapters[ch].formula;
    showQuestion();
    showHome(); document.getElementById('quizBox').classList.remove('hidden');
}

function startFullTest(ch){
    currentQs = [...DATA.PHY11.chapters[ch].mcqs,...DATA.PHY11.chapters[ch].mcqs].slice(0,20);
    qIndex=0; score=0; answers=[];
    document.getElementById('quizTitle').innerText = DATA.PHY11.chapters[ch].name + " - Full Chapter Test 20 MCQs";
    document.getElementById('formulaBox').innerText = "Formula: " + DATA.PHY11.chapters[ch].formula;
    showQuestion();
    showHome(); document.getElementById('quizBox').classList.remove('hidden');
}

function showQuestion(){
    let q = currentQs[qIndex];
    document.getElementById('qText').innerText = q.q;
    document.getElementById('qCount').innerText = `${qIndex+1}/${currentQs.length}`;
    let opts = '';
    q.opts.forEach((opt,i)=> opts += `<button class="btn-option" onclick="selectAns(${i}, this)">${opt}</button>`);
    document.getElementById('options').innerHTML = opts;
}

function selectAns(i, el){
    answers[qIndex]=i;
    document.querySelectorAll('.btn-option').forEach(b=>b.disabled=true);
    if(i==currentQs[qIndex].ans) el.classList.add('correct'); else el.classList.add('wrong');
}

function nextQ(){ if(qIndex<currentQs.length-1) {qIndex++; showQuestion();} }
function prevQ(){ if(qIndex>0) {qIndex--; showQuestion();} }

function submitQuiz(){
    score = answers.filter((a,i)=>a===currentQs[i].ans).length;
    let per = ((score/currentQs.length)*100).toFixed(1);
    document.getElementById('resultBox').innerHTML = `<h2 class="text-2xl font-bold mb-2">Score: ${score}/${currentQs.length}</h2><p class="text-lg">${per}%</p>`;
    showHome(); document.getElementById('resultBox').classList.remove('hidden');
}

// GAME 15 LEVELS
function showGame(){
    gameLevel=1;
    gameQs = DATA.PHY11.CH1.mcqs.concat(DATA.PHY11.CH2.mcqs, DATA.PHY11.CH3.mcqs).slice(0,15);
    loadGameLevel();
    showHome(); document.getElementById('gameBox').classList.remove('hidden');
}
function loadGameLevel(){
    document.getElementById('levelNum').innerText = gameLevel;
    let q = gameQs[gameLevel-1];
    document.getElementById('gameQ').innerText = q.q;
    document.getElementById('hintText').innerText = "Hint: Recall the formula for this topic";
    document.getElementById('hintText').classList.add('hidden');
    let opts='';
    q.opts.forEach((opt,i)=> opts+=`<button class="btn-option" onclick="checkGame(${i},${q.ans})">${opt}</button>`);
    document.getElementById('gameOptions').innerHTML=opts;
}
function checkGame(i,ans){
    if(i==ans && gameLevel<15) gameLevel++;
    loadGameLevel();
}
function showHint(){ document.getElementById('hintText').classList.remove('hidden'); }

// AI BOT
function showAIBot(){ showHome(); document.getElementById('aiBot').classList.remove('hidden'); }
function askBot(){
    let input = document.getElementById('chatInput').value;
    document.getElementById('chatLog').innerHTML += `<div class="text-right mb-1">You: ${input}</div>`;
    let reply = "Astra Bot: For formulas check the formula box above. Ask me about CH1, CH2, CH3 concepts.";
    document.getElementById('chatLog').innerHTML += `<div class="text-left text-cyan-400 mb-1">Bot: ${reply}</div>`;
    document.getElementById('chatInput').value='';
}
</script>
</body>
</html>
