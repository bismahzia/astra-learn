<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra Learn v6.1 - Game + MCQs + Gemini</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
 body { background: linear-gradient(135deg, #020617 0%, #0f172a 100%); font-family: 'Poppins', sans-serif; }
.glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.2); }
.btn { padding: 0.8rem 1.6rem; border-radius: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.btn-primary { background: linear-gradient(90deg, #0ea5e9, #06b6d4); color: white; box-shadow: 0 0 15px rgba(14,165,233,0.4); }
.btn-primary:hover { transform: scale(1.05) translateY(-2px); }
.btn-subject { width: 100%; padding: 1.5rem; border-radius: 1.2rem; background: linear-gradient(145deg, #1e293b, #0f172a); text-align: left; border: 1px solid #334155; }
.btn-subject:hover { border-color: #0ea5e9; transform: translateY(-5px); }
.btn-option { width: 100%; text-align: left; padding: 1rem; margin: 0.6rem 0; border-radius: 0.8rem; background: #1e293b; border: 2px solid #334155; }
.btn-option:hover { background: #334155; border-color: #38bdf8; }
.correct { background: rgba(34,197,94,0.2)!important; border: 2px solid #22c55e!important; }
.wrong { background: rgba(239,68,68,0.2)!important; border: 2px solid #ef4444!important; }

.hint-box { background: rgba(234,179,8,0.15); border: 1px solid #eab308; padding: 12px; border-radius: 10px; margin: 10px 0; color:#fde047; }
#chatBox { height: 400px; overflow-y: auto; scrollbar-width: thin; }
.user-msg { background: #0ea5e9; color: white; padding: 10px; border-radius: 15px; margin: 5px; text-align: right; }
.bot-msg { background: #1e293b; color: #cbd5e1; padding: 10px; border-radius: 15px; margin: 5px; text-align: left; }

   <button onclick="showSubjects('CS11')" class="btn-subject">💻 <b>Computer Science Grade 11</b><p class="text-sm text-slate-400">6 Chapters, 90 MCQs</p></button>

},

    name: "Coding Game",
    levels: [
      {level: 1, q: "Level 1: What will be the output of print(2 + 3 * 2)?", opts: ["10","8","7","12"], ans: 2, hint: "BODMAS rule: 3*2=6, then 2+6=8"},
      {level: 2, q: "Level 2: Which data type is used to store True or False?", opts: ["int","string","boolean","float"], ans: 2, hint: "Boolean has only 2 values"},

      {level: 4, q: "Level 4: What will be output of len('Hello')?", opts: ["4","5","6","Error"], ans: 1, hint: "H-e-l-l-o = 5 characters"},

// ===== JS FUNCTIONS =====
let currentSubject="", currentChapter="", currentQ=0, score=0, gameLevel=0;

function showDiv(id){
 ['home','chapterMenu','quizBox','gameBox','aiBot'].forEach(d=>document.getElementById(d).classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
}
function showHome(){ showDiv('home'); }

function showSubjects(sub){
 currentSubject = sub;
 let menu = document.getElementById('chapterMenu');
 menu.innerHTML = `<h2 class="text-2xl font-bold mb-4">${QUIZ_DATA[sub].name} - Select Chapter</h2><div class="grid md:grid-cols-2 gap-4">`;
 for(let ch in QUIZ_DATA[sub]){
  if(ch.startsWith("CH")){
   menu.innerHTML += `<button onclick="startQuiz('${sub}','${ch}')" class="btn-subject">
   <h3 class="font-bold text-lg">${QUIZ_DATA[sub][ch].name}</h3>
   <p class="text-sm text-cyan-300">Formula: ${QUIZ_DATA[sub][ch].formula}</p>
   <p class="text-xs mt-2">15 MCQs</p></button>`;
  }
 menu.innerHTML += `</div>`; showDiv('chapterMenu');
}

function startQuiz(sub, ch){ currentSubject=sub; currentChapter=ch; currentQ=0; score=0; showDiv('quizBox'); loadQuestion(); }

function loadQuestion(){
 let qData = QUIZ_DATA[currentSubject][currentChapter].topics.MCQs[currentQ];
 let hint = QUIZ_DATA[currentSubject][currentChapter].hint;
 document.getElementById('quizBox').innerHTML = `
  <div class="glass p-6 rounded-2xl">
   <div class="flex justify-between"><h3 class="text-xl mb-2">${QUIZ_DATA[currentSubject][currentChapter].name}</h3><span>Q ${currentQ+1}/15</span></div>
   <p class="text-sm text-cyan-300 mb-2">Formula: ${QUIZ_DATA[currentSubject][currentChapter].formula}</p>
   <button onclick="toggleHint()" class="btn bg-yellow-600 mb-4">💡 Show Hint</button>
   <div id="hintBox" class="hint-box hidden">${hint}</div>
   <h4 class="text-2xl font-bold mb-4">${qData.q}</h4>
   ${qData.opts.map((opt,i)=>`<button onclick="checkAnswer(${i})" class="btn-option" id="opt${i}">${i+1}. ${opt}</button>`).join('')}
  </div>`;
}

function toggleHint(){ document.getElementById('hintBox').classList.toggle('hidden'); }

function checkAnswer(i){
 let qData = QUIZ_DATA[currentSubject][currentChapter].topics.MCQs[currentQ];
 document.querySelectorAll('.btn-option').forEach(b=>b.disabled=true);
 if(i==qData.ans){ document.getElementById('opt'+i).classList.add('correct'); score++; }
 else{ document.getElementById('opt'+i).classList.add('wrong'); document.getElementById('opt'+qData.ans).classList.add('correct'); }
 setTimeout(()=>{ currentQ++; if(currentQ<15) loadQuestion(); else alert(`Quiz Finished! Your Score: ${score}/15`); },1200);
}

// ===== GAME FUNCTIONS =====
function showGame(){ gameLevel=0; showDiv('gameBox'); loadGameLevel(); }

function loadGameLevel(){
 let qData = QUIZ_DATA.GAME.levels[gameLevel];
 document.getElementById('gameBox').innerHTML = `
  <div class="glass p-8 rounded-2xl">
   <h2 class="text-3xl font-bold text-center mb-2 text-green-400">${qData.q}</h2>
   <p class="text-center mb-4">Level ${gameLevel+1} / 5</p>
   <button onclick="alert('Hint: ${qData.hint}')" class="btn bg-yellow-600 mb-4 w-full">💡 Get Hint</button>
   ${qData.opts.map((opt,i)=>`<button onclick="checkGame(${i})" class="btn-option" id="gopt${i}">${i+1}. ${opt}</button>`).join('')}
  </div>`;
}

function checkGame(i){
 let qData = QUIZ_DATA.GAME.levels[gameLevel];
 document.querySelectorAll('#gameBox.btn-option').forEach(b=>b.disabled=true);
 if(i==qData.ans){
  document.getElementById('gopt'+i).classList.add('correct');
  setTimeout(()=>{ gameLevel++; if(gameLevel<5) loadGameLevel(); else document.getElementById('gameBox').innerHTML=`<div class="text-center"><h2 class="text-4xl mb-4">🎉 YOU WON THE GAME! 🎉</h2><button onclick="showGame()" class="btn btn-primary">Play Again</button></div>`; },1000);
 } else {
  document.getElementById('gopt'+i).classList.add('wrong'); document.getElementById('gopt'+qData.ans).classList.add('correct');
  setTimeout(()=>{ alert('Wrong Answer! Try Again'); loadGameLevel(); },1000);
 }
}

// ===== GEMINI AI BOT =====
function showAiBot(){
 showDiv('aiBot');
 document.getElementById('aiBot').innerHTML = `
  <div class="glass p-6 rounded-2xl">
   <h2 class="text-2xl font-bold mb-4">🤖 Gemini AI Tutor</h2>
   <div id="chatBox" class="mb-4"></div>
   <div class="flex"><input id="userInput" type="text" placeholder="Ask any question about Physics, Maths, CS..." class="w-full p-3 rounded-l-lg bg-[#1e293b] border border-slate-600">
   <button onclick="sendMessage()" class="btn btn-primary rounded-l-none">Send</button></div>
  </div>`;
}

async function sendMessage(){
 let input = document.getElementById('userInput');
 let msg = input.value; if(!msg) return;
 document.getElementById('chatBox').innerHTML += `<div class="user-msg">${msg}</div>`;
 input.value = "";

 const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,{
  method: "POST",
  headers: {"Content-Type": "application/json"},
  body: JSON.stringify({contents: [{parts: [{text: msg}]}]})
 });
 const data = await response.json();
 let reply = data.candidates[0].content.parts[0].text;
 document.getElementById('chatBox').innerHTML += `<div class="bot-msg">${reply}</div>`;
 document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
}
</script>
</body>
</html>
